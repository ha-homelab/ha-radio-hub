<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 638" role="img" aria-labelledby="title desc">
<title id="title">24 GHz radar: pin-to-pin connection sheet</title>
<desc id="desc">Logical connection drawing. Port positions do not represent a physical header. Verified pad numbers and unknown positions are identified separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="arrowback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0L0 5L10 10z" fill="#0f766e"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b3a}.pin{font-size:19px;font-weight:600}.target{font-size:16px}.small{font-size:13px;fill:#526375}</style>
<rect width="1180" height="638" fill="white"/>
<text x="28" y="44" font-size="16" fill="#0f766e">HA RADIO HUB · LP-P0 · CONNECTION ATLAS</text>
<text x="28" y="82" font-size="30" font-weight="700">24 GHz radar</text>
<text x="28" y="114" font-size="17">Hi-Link HLK-LD2450</text>
<text x="28" y="144" class="small">Logical port order — NOT a connector face. Use verified pad labels; check unverified module markings.</text>
<text x="44" y="177" class="small">THIS COMPONENT</text><text x="652" y="177" class="small">CONNECTED ENDPOINT / SUPPLY</text>
<rect x="28" y="190" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="217" class="pin">RX</text><text x="44" y="239" class="small">Physical position: verify module markings</text><path d="M365 222 H625" fill="none" stroke="#0f766e" stroke-width="2" marker-start="url(#arrowback)"/><text x="495" y="250" text-anchor="middle" class="small">ld2450_tx</text><text x="652" y="217" class="target">S3 host / GPIO39 / ld2450_tx (module pad: 32)</text><rect x="28" y="282" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="309" class="pin">TX</text><text x="44" y="331" class="small">Physical position: verify module markings</text><path d="M365 314 H625" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="342" text-anchor="middle" class="small">ld2450_rx</text><text x="652" y="309" class="target">S3 host / GPIO40 / ld2450_rx (module pad: 33)</text><rect x="28" y="374" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="401" class="pin">5V</text><text x="44" y="423" class="small">Physical position: verify module markings</text><path d="M365 406 H625" fill="none" stroke="#b45309" stroke-width="2"/><text x="495" y="434" text-anchor="middle" class="small">5v_fused</text><text x="652" y="401" class="target">Fused isolated 5 V — shared supply net</text><rect x="28" y="466" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="493" class="pin">GND</text><text x="44" y="515" class="small">Physical position: verify module markings</text><path d="M365 498 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="526" text-anchor="middle" class="small">gnd</text><text x="652" y="493" class="target">Isolated secondary GND — shared supply net</text>
<text x="28" y="582" class="small">Orange = supply; gray = ground; green = signal. MG24 RESETn uses internal DVDD; never drive it high.</text>
<text x="28" y="604" class="small">Design contract, not a record of tested hardware. Source: hardware/low-power/visual/connections.json.</text>
</svg>