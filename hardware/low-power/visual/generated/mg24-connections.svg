 x="495" y="986" text-anchor="middle" class="small">3v3</text><text x="652" y="953" class="target">Shared regulated 3.3 V — shared supply net</text><rect x="28" y="1018" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1045" class="pin">GND</text><text x="44" y="1067" class="small">module pad: 1</text><path d="M365 1050 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1078" text-anchor="middle" class="small">gnd</text><text x="652" y="1045" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1110" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1137" class="pin">GND</text><text x="44" y="1159" class="small">module pad: 14</text><path d="M365 1142 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1170" text-anchor="middle" class="small">gnd</text><text x="652" y="1137" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1202" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1229" class="pin">GND</text><text x="44" y="1251" class="small">module pad: 23</text><path d="M365 1234 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1262" text-anchor="middle" class="small">gnd</text><text x="652" y="1229" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1294" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1321" class="pin">GND</text><text x="44" y="1343" class="small">module pad: 32</text><path d="M365 1326 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1354" text-anchor="middle" class="small">gnd</text><text x="652" y="1321" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1386" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1413" class="pin">GND</text><text x="44" y="1435" class="small">module pad: 34</text><path d="M365 1418 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1446" text-anchor="middle" class="small">gnd</text><text x="652" y="1413" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1478" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1505" class="pin">GND</text><text x="44" y="1527" class="small">module pad: 35</text><path d="M365 1510 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1538" text-anchor="middle" class="small">gnd</text><text x="652" y="1505" class="target">Isolated secondary GND — shared supply net</text><rect x="28" y="1570" width="1124" height="84" rx="6" fill="#f1f5f8"/><text x="44" y="1597" class="pin">GND</text><text x="44" y="1619" class="small">module pad: 36</text><path d="M365 1602 H625" fill="none" stroke="#526375" stroke-width="2"/><text x="495" y="1630" text-anchor="middle" class="small">gnd</text><text x="652" y="1597" class="target">Isolated secondary GND — shared supply net</text>
