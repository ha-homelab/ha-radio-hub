<text x="40.000" y="883.000" class="note" text-anchor="start" >Datasheet v1.6 Fig 11 p38 and Fig3 p9:13.2x16.6, pitch0.8, main rows11.8x9.8</text>
<text x="40.000" y="915.000" class="note" text-anchor="start" >49 identifies the exposed-ground array; 50-53 are corner ground pads.</text>
<text x="40.000" y="940.000" class="note" text-anchor="start" >Pad1 is below corner53. A DevKit header uses different numbering.</text>
<text x="40.000" y="991.000" class="note" text-anchor="start" >Body/antenna outline is a reference, not a complete RF keep-out or case clearance.</text>
<text x="40.000" y="1016.000" class="note" text-anchor="start" >Sources and source-derived coordinates: catalog.json, generated/contacts.json.</text>
<text x="40.000" y="1041.000" class="note" text-anchor="start" >Red = first contact/orientation reference. Numbers identify pads, not ESP GPIOs.</text>
