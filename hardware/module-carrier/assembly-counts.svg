<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Builder-installed capacitor and resistor counts"><rect width="1200" height="420" fill="white"/><g font-family="Arial,sans-serif"><text x="32" y="45" font-size="28" fill="#203748" font-weight="700">Builder-installed capacitors + resistors</text><text x="32" y="79" font-size="17" fill="#203748" font-weight="400">Component placements from the respective BOMs; alternative builds are not added together.</text><text x="32" y="137" font-size="18" fill="#203748" font-weight="400">C0 + M0 · historical</text><rect x="285" y="112" width="304" height="37" rx="3" fill="#8298a7"/><text x="604" y="138" font-size="21" fill="#203748" font-weight="700">38</text><text x="32" y="207" font-size="18" fill="#203748" font-weight="400">I0 · historical</text><rect x="285" y="182" width="632" height="37" rx="3" fill="#8298a7"/><text x="932" y="208" font-size="21" fill="#203748" font-weight="700">79</text><text x="32" y="277" font-size="18" fill="#203748" font-weight="400">MC1 · current</text><rect x="285" y="252" width="16" height="37" rx="3" fill="#287a63"/><text x="316" y="278" font-size="21" fill="#203748" font-weight="700">2</text><text x="32" y="351" font-size="18" fill="#203748" font-weight="400">MC1 also has 3 through-hole diodes, 7 fitted connectors and 4 complete board modules.</text><text x="32" y="383" font-size="17" fill="#203748" font-weight="400">86 module header pins still need through-hole solder joints. Factory-fitted module parts are excluded above.</text></g></svg>