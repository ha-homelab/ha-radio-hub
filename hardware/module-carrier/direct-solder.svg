<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 450" role="img" aria-label="Direct solder through-hole assembly"><rect width="1320" height="450" fill="white"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="29" fill="#203748" font-weight="700">Factory male pins → plated carrier holes → underside solder</text><text x="36" y="86" font-size="18" fill="#203748" font-weight="400">Assembly principle; section not to scale. Actual heights and underside clearance require a dry fit.</text><rect x="115" y="146" width="500" height="22" fill="#2e6670"/><rect x="160" y="172" width="34" height="35" fill="#374750"/><rect x="173" y="155" width="7" height="159" fill="#b78e42"/><rect x="510" y="172" width="34" height="35" fill="#374750"/><rect x="523" y="155" width="7" height="159" fill="#b78e42"/><rect x="100" y="274" width="540" height="18" fill="#41866c"/><ellipse cx="176" cy="294" rx="17" ry="7" fill="#aebbc2"/><ellipse cx="526" cy="294" rx="17" ry="7" fill="#aebbc2"/><text x="700" y="166" font-size="20" fill="#203748" font-weight="400">Finished module; factory circuitry stays intact</text><text x="700" y="205" font-size="20" fill="#203748" font-weight="400">Existing male header and its plastic spacer</text><text x="700" y="284" font-size="20" fill="#203748" font-weight="400">Carrier PCB with plated through-holes</text><text x="700" y="321" font-size="20" fill="#203748" font-weight="400">Solder joints on the underside</text><text x="36" y="385" font-size="20" fill="#203748" font-weight="700">No female socket. No castellated-side soldering. Module replacement requires desoldering.</text><text x="36" y="421" font-size="17" fill="#203748" font-weight="400">USB service: complete powered assembly + verified VBUS blocker. This section drawing is mechanical, not electrical.</text></g></svg>