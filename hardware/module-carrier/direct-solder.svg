<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="810" viewBox="0 0 1320 810" role="img" aria-label="Two-sided direct solder mounting and clearance principle"><rect width="1320" height="810" fill="white"/><g font-family="Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#203748" font-weight="700">Two sides, direct male pins, a controlled clearance</text><text x="32" y="82" font-size="18" fill="#203748" font-weight="400">Section principle only; not to scale. Use the CAD assembly order and measure the purchased modules.</text><rect x="50" y="117" width="640" height="24" fill="#e4e7eb"/><path d="M58 116 l16 -12 M90 116 l16 -12 M122 116 l16 -12 M154 116 l16 -12 M186 116 l16 -12" stroke="#9ca7b3" fill="none"/><text x="725" y="137" font-size="21" fill="#203748" font-weight="700">Ceiling / enclosure mounting surface</text><text x="725" y="168" font-size="17" fill="#203748" font-weight="400">Split edge supports not shown.</text><rect x="90" y="235" width="195" height="101" rx="3" fill="#b9c5cf" stroke="#5e788c"/><rect x="75" y="336" width="230" height="18" fill="#426d79"/><text x="112" y="281" font-size="18" fill="#203748" font-weight="400">RJ45 / WIZ850io</text><rect x="104" y="354" width="28" height="47" fill="#374750"/><rect x="248" y="354" width="28" height="47" fill="#374750"/><rect x="115" y="348" width="6" height="97" fill="#bd964b"/><rect x="259" y="348" width="6" height="97" fill="#bd964b"/><rect x="476" y="381" width="84" height="20" fill="#374750"/><rect x="487" y="266" width="6" height="182" fill="#bd964b"/><rect x="511" y="266" width="6" height="182" fill="#bd964b"/><rect x="535" y="266" width="6" height="182" fill="#bd964b"/><text x="450" y="246" font-size="17" fill="#203748" font-weight="400">Male header</text><rect x="50" y="401" width="640" height="27" fill="#43806c"/><text x="725" y="418" font-size="22" fill="#203748" font-weight="700">One carrier PCB · two copper layers</text><rect x="350" y="482" width="330" height="20" fill="#426d79"/><rect x="364" y="428" width="24" height="54" fill="#374750"/><rect x="373" y="384" width="6" height="111" fill="#bd964b"/><ellipse cx="376" cy="398" rx="12" ry="5" fill="#b4c0c9"/><rect x="638" y="428" width="24" height="54" fill="#374750"/><rect x="647" y="384" width="6" height="111" fill="#bd964b"/><ellipse cx="650" cy="398" rx="12" ry="5" fill="#b4c0c9"/><rect x="465" y="456" width="96" height="26" fill="#657580"/><ellipse cx="118" cy="430" rx="12" ry="5" fill="#b4c0c9"/><ellipse cx="262" cy="430" rx="12" ry="5" fill="#b4c0c9"/><ellipse cx="490" cy="430" rx="12" ry="5" fill="#b4c0c9"/><ellipse cx="514" cy="430" rx="12" ry="5" fill="#b4c0c9"/><ellipse cx="538" cy="430" rx="12" ry="5" fill="#b4c0c9"/><text x="350" y="531" font-size="20" fill="#203748" font-weight="700">S3 / H2 / MG24 · room-facing</text><path d="M695 433 v44 m-6 -8 l6 8 6 -8 M689 441 l6 -8 6 8" fill="none" stroke="#2c698d" stroke-width="2"/><text x="704" y="461" font-size="20" fill="#203748" font-weight="700">g</text><text x="725" y="202" font-size="21" fill="#203748" font-weight="700">Ceiling-facing: Ethernet and harness pins</text><text x="725" y="242" font-size="19" fill="#203748" font-weight="400">Provide room for the jack, mating plugs,</text><text x="725" y="270" font-size="19" fill="#203748" font-weight="400">wire bends and access to the RJ45 latch.</text><text x="725" y="477" font-size="20" fill="#203748" font-weight="400">g = carrier-to-module PCB gap</text><text x="725" y="516" font-size="19" fill="#203748" font-weight="400">Subtract underside parts and solder/tail height.</text><text x="725" y="550" font-size="19" fill="#203748" font-weight="400">The remainder must meet the clearance target.</text><text x="725" y="599" font-size="18" fill="#8a4d27" font-weight="400">A plastic spacer alone does not prove no contact.</text><text x="32" y="622" font-size="19" fill="#203748" font-weight="700">Measured residual gap target: at least 1 mm at every permitted overlap.</text><text x="32" y="669" font-size="24" fill="#203748" font-weight="700">Solderability is a separate constraint</text><text x="32" y="706" font-size="19" fill="#203748" font-weight="400">Solder the entire back first, including WIZ; inspect and trim. Then fit the front and solder from the back.</text><text x="32" y="753" font-size="18" fill="#203748" font-weight="400">No female module sockets. Physical module replacement requires desoldering. No postassembly USB cable space.</text></g></svg>