<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="Bounded Thread recovery"><rect width="1240" height="480" fill="#fff"/><g font-family="Arial,sans-serif"><text x="32" y="46" font-size="28" fill="#203748" font-weight="700">A failed Thread radio must not cause a reboot loop</text><rect x="32" y="100" width="350" height="155" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="50" y="132" font-size="21" fill="#203748" font-weight="700">Boot + RCP preflight</text><text x="50" y="165" font-size="17" fill="#203748" font-weight="400">Ethernet ready; probe H2</text><text x="50" y="190" font-size="17" fill="#203748" font-weight="400">No response → quarantine</text><text x="50" y="215" font-size="17" fill="#203748" font-weight="400">Keep the other services running</text><rect x="444" y="100" width="350" height="155" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="462" y="132" font-size="21" fill="#203748" font-weight="700">Thread operational</text><text x="462" y="165" font-size="17" fill="#203748" font-weight="400">Local border router + REST</text><text x="462" y="190" font-size="17" fill="#203748" font-weight="400">Normal transient recovery stays</text><text x="462" y="215" font-size="17" fill="#203748" font-weight="400">Terminal fault → record failure</text><rect x="856" y="100" width="350" height="155" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="874" y="132" font-size="21" fill="#203748" font-weight="700">Persistent quarantine</text><text x="874" y="165" font-size="17" fill="#203748" font-weight="400">At most one controlled restart</text><text x="874" y="190" font-size="17" fill="#203748" font-weight="400">Next boot leaves Thread stopped</text><text x="874" y="215" font-size="17" fill="#203748" font-weight="400">User retry explicitly re-arms it</text><path d="M382 175 h58 m-9 -7 l9 7 -9 7" fill="none" stroke="#2c698d" stroke-width="3"/><path d="M794 175 h58 m-9 -7 l9 7 -9 7" fill="none" stroke="#2c698d" stroke-width="3"/><rect x="32" y="300" width="1174" height="105" rx="8" fill="#f6eedf" stroke="#7894a4"/><text x="50" y="332" font-size="21" fill="#203748" font-weight="700">Other services still share the S3</text><text x="50" y="365" font-size="17" fill="#203748" font-weight="400">A terminal Thread fault briefly interrupts every service during the restart. This is bounded recovery, not hardware isolation.</text><text x="32" y="452" font-size="17" fill="#203748" font-weight="400">Commissioning, power-loss recovery and simultaneous-load acceptance still require the assembled hardware.</text></g></svg>