<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="Measured routed copper before and after the mounting and placement revision"><rect width="1280" height="1010" fill="white"/><g font-family="Arial,sans-serif"><text x="32" y="43" font-size="30" fill="#203748" font-weight="700">Measure the routed result, not the angle alone</text><text x="32" y="82" font-size="23" fill="#203748" font-weight="400">All explicit tracks: 1749.0 → 1736.7 mm  |  Vias: 19 → 18</text><text x="32" y="118" font-size="18" fill="#203748" font-weight="400">Same pin map and width rules; mounting, component placement and routing revised together.</text><rect x="32" y="141" width="20" height="12" fill="#a6b5c2"/><rect x="245" y="141" width="20" height="12" fill="#257c78"/><text x="62" y="154" font-size="16" fill="#203748" font-weight="400">Previous with ear</text><text x="275" y="154" font-size="16" fill="#203748" font-weight="400">Current; amber = longer net</text><text x="32" y="223" font-size="18" fill="#203748" font-weight="400">H2 supply after D2</text><rect x="310" y="207" width="74.85702" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="226" width="71.91702000000001" height="12" rx="2" fill="#257c78"/><text x="956" y="222" font-size="18" fill="#203748" font-weight="400">17.82 → 17.12 mm</text><text x="956" y="245" font-size="15" fill="#257c78" font-weight="400">-0.70 mm</text><text x="32" y="299" font-size="18" fill="#203748" font-weight="400">Zigbee supply after D3</text><rect x="310" y="283" width="21.647640000000003" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="302" width="35.51646" height="12" rx="2" fill="#ab671f"/><text x="956" y="298" font-size="18" fill="#203748" font-weight="400">5.15 → 8.46 mm</text><text x="956" y="321" font-size="15" fill="#ab671f" font-weight="400">+3.30 mm</text><text x="32" y="375" font-size="18" fill="#203748" font-weight="400">S3 supply after D1</text><rect x="310" y="359" width="62.29272" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="378" width="60.5808" height="12" rx="2" fill="#257c78"/><text x="956" y="374" font-size="18" fill="#203748" font-weight="400">14.83 → 14.42 mm</text><text x="956" y="397" font-size="15" fill="#257c78" font-weight="400">-0.41 mm</text><text x="32" y="451" font-size="18" fill="#203748" font-weight="400">Shared 5 V network</text><rect x="310" y="435" width="434.46018" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="454" width="441.16758000000004" height="12" rx="2" fill="#ab671f"/><text x="956" y="450" font-size="18" fill="#203748" font-weight="400">103.44 → 105.04 mm</text><text x="956" y="473" font-size="15" fill="#ab671f" font-weight="400">+1.60 mm</text><text x="32" y="527" font-size="18" fill="#203748" font-weight="400">Peripheral 3.3 V network</text><rect x="310" y="511" width="606.52788" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="530" width="484.83708" height="12" rx="2" fill="#257c78"/><text x="956" y="526" font-size="18" fill="#203748" font-weight="400">144.41 → 115.44 mm</text><text x="956" y="549" font-size="15" fill="#257c78" font-weight="400">-28.97 mm</text><text x="32" y="603" font-size="18" fill="#203748" font-weight="400">RF chip-select network</text><rect x="310" y="587" width="159.25308" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="606" width="159.17705999999998" height="12" rx="2" fill="#257c78"/><text x="956" y="602" font-size="18" fill="#203748" font-weight="400">37.92 → 37.90 mm</text><text x="956" y="625" font-size="15" fill="#257c78" font-weight="400">-0.02 mm</text><text x="32" y="679" font-size="18" fill="#203748" font-weight="400">SPI MOSI network</text><rect x="310" y="663" width="519.81678" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="682" width="434.10864000000004" height="12" rx="2" fill="#257c78"/><text x="956" y="678" font-size="18" fill="#203748" font-weight="400">123.77 → 103.36 mm</text><text x="956" y="701" font-size="15" fill="#257c78" font-weight="400">-20.41 mm</text><text x="32" y="755" font-size="18" fill="#203748" font-weight="400">SPI MISO network</text><rect x="310" y="739" width="432.26988000000006" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="758" width="432.20436" height="12" rx="2" fill="#257c78"/><text x="956" y="754" font-size="18" fill="#203748" font-weight="400">102.92 → 102.91 mm</text><text x="956" y="777" font-size="15" fill="#257c78" font-weight="400">-0.02 mm</text><text x="32" y="831" font-size="18" fill="#203748" font-weight="400">SPI clock network</text><rect x="310" y="815" width="475.11366" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="834" width="453.34211999999997" height="12" rx="2" fill="#257c78"/><text x="956" y="830" font-size="18" fill="#203748" font-weight="400">113.12 → 107.94 mm</text><text x="956" y="853" font-size="15" fill="#257c78" font-weight="400">-5.18 mm</text><text x="32" y="918" font-size="18" fill="#203748" font-weight="400">Totals include every branch in each named net. They are not single source-to-load distances.</text><text x="32" y="948" font-size="18" fill="#203748" font-weight="400">Copper pours, module internals, through-hole barrels and external harnesses are excluded.</text><text x="32" y="978" font-size="17" fill="#203748" font-weight="400">Shorter total routing is not proof of signal integrity or a global optimum. Full per-net data are linked in the guide.</text></g></svg>