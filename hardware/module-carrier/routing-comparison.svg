<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="Measured routed copper before and after the mounting and placement revision"><rect width="1280" height="1010" fill="white"/><g font-family="Arial,sans-serif"><text x="32" y="43" font-size="30" fill="#203748" font-weight="700">Measure the routed result, not the angle alone</text><text x="32" y="82" font-size="23" fill="#203748" font-weight="400">All explicit tracks: 1736.7 → 1612.1 mm  |  Vias: 18 → 24</text><text x="32" y="118" font-size="18" fill="#203748" font-weight="400">Same pin map and width rules; mounting, component placement and routing revised together.</text><rect x="32" y="141" width="20" height="12" fill="#a6b5c2"/><rect x="245" y="141" width="20" height="12" fill="#257c78"/><text x="62" y="154" font-size="16" fill="#203748" font-weight="400">Previous: four holes</text><text x="275" y="154" font-size="16" fill="#203748" font-weight="400">Current; amber = longer net</text><text x="32" y="223" font-size="18" fill="#203748" font-weight="400">H2 supply after D2</text><rect x="310" y="207" width="71.91702000000001" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="226" width="72.94644000000001" height="12" rx="2" fill="#ab671f"/><text x="956" y="222" font-size="18" fill="#203748" font-weight="400">17.12 → 17.37 mm</text><text x="956" y="245" font-size="15" fill="#ab671f" font-weight="400">+0.25 mm</text><text x="32" y="299" font-size="18" fill="#203748" font-weight="400">Zigbee supply after D3</text><rect x="310" y="283" width="35.51646" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="302" width="35.51646" height="12" rx="2" fill="#257c78"/><text x="956" y="298" font-size="18" fill="#203748" font-weight="400">8.46 → 8.46 mm</text><text x="956" y="321" font-size="15" fill="#257c78" font-weight="400">+0.00 mm</text><text x="32" y="375" font-size="18" fill="#203748" font-weight="400">S3 supply after D1</text><rect x="310" y="359" width="60.5808" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="378" width="60.5808" height="12" rx="2" fill="#257c78"/><text x="956" y="374" font-size="18" fill="#203748" font-weight="400">14.42 → 14.42 mm</text><text x="956" y="397" font-size="15" fill="#257c78" font-weight="400">+0.00 mm</text><text x="32" y="451" font-size="18" fill="#203748" font-weight="400">Shared 5 V network</text><rect x="310" y="435" width="441.16758000000004" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="454" width="393.42492000000004" height="12" rx="2" fill="#257c78"/><text x="956" y="450" font-size="18" fill="#203748" font-weight="400">105.04 → 93.67 mm</text><text x="956" y="473" font-size="15" fill="#257c78" font-weight="400">-11.37 mm</text><text x="32" y="527" font-size="18" fill="#203748" font-weight="400">Peripheral 3.3 V network</text><rect x="310" y="511" width="484.83708" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="530" width="424.54230000000007" height="12" rx="2" fill="#257c78"/><text x="956" y="526" font-size="18" fill="#203748" font-weight="400">115.44 → 101.08 mm</text><text x="956" y="549" font-size="15" fill="#257c78" font-weight="400">-14.36 mm</text><text x="32" y="603" font-size="18" fill="#203748" font-weight="400">RF chip-select network</text><rect x="310" y="587" width="159.17705999999998" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="606" width="138.11867999999998" height="12" rx="2" fill="#257c78"/><text x="956" y="602" font-size="18" fill="#203748" font-weight="400">37.90 → 32.89 mm</text><text x="956" y="625" font-size="15" fill="#257c78" font-weight="400">-5.01 mm</text><text x="32" y="679" font-size="18" fill="#203748" font-weight="400">SPI MOSI network</text><rect x="310" y="663" width="434.10864000000004" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="682" width="495.08382" height="12" rx="2" fill="#ab671f"/><text x="956" y="678" font-size="18" fill="#203748" font-weight="400">103.36 → 117.88 mm</text><text x="956" y="701" font-size="15" fill="#ab671f" font-weight="400">+14.52 mm</text><text x="32" y="755" font-size="18" fill="#203748" font-weight="400">SPI MISO network</text><rect x="310" y="739" width="432.20436" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="758" width="360.48264" height="12" rx="2" fill="#257c78"/><text x="956" y="754" font-size="18" fill="#203748" font-weight="400">102.91 → 85.83 mm</text><text x="956" y="777" font-size="15" fill="#257c78" font-weight="400">-17.08 mm</text><text x="32" y="831" font-size="18" fill="#203748" font-weight="400">SPI clock network</text><rect x="310" y="815" width="453.34211999999997" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="834" width="399.2268" height="12" rx="2" fill="#257c78"/><text x="956" y="830" font-size="18" fill="#203748" font-weight="400">107.94 → 95.05 mm</text><text x="956" y="853" font-size="15" fill="#257c78" font-weight="400">-12.88 mm</text><text x="32" y="918" font-size="18" fill="#203748" font-weight="400">Totals include every branch in each named net. They are not single source-to-load distances.</text><text x="32" y="948" font-size="18" fill="#203748" font-weight="400">Copper pours, module internals, through-hole barrels and external harnesses are excluded.</text><text x="32" y="978" font-size="17" fill="#203748" font-weight="400">Shorter total routing is not proof of signal integrity or a global optimum. Full per-net data are linked in the guide.</text></g></svg>