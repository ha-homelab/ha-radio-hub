<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="Measured routed copper before and after the mounting and placement revision"><rect width="1280" height="1010" fill="white"/><g font-family="Arial,sans-serif"><text x="32" y="43" font-size="30" fill="#203748" font-weight="700">Measure the routed result, not the angle alone</text><text x="32" y="82" font-size="23" fill="#203748" font-weight="400">All explicit tracks: 1942.5 → 1749.0 mm  |  Vias: 35 → 19</text><text x="32" y="118" font-size="18" fill="#203748" font-weight="400">Same pin map and width rules; mounting, component placement and routing revised together.</text><rect x="32" y="141" width="20" height="12" fill="#a6b5c2"/><rect x="245" y="141" width="20" height="12" fill="#257c78"/><text x="62" y="154" font-size="16" fill="#203748" font-weight="400">Previous 51 × 75</text><text x="275" y="154" font-size="16" fill="#203748" font-weight="400">Current; amber = longer net</text><text x="32" y="223" font-size="18" fill="#203748" font-weight="400">H2 supply after D2</text><rect x="310" y="207" width="339.5616" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="226" width="74.85702" height="12" rx="2" fill="#257c78"/><text x="956" y="222" font-size="18" fill="#203748" font-weight="400">80.85 → 17.82 mm</text><text x="956" y="245" font-size="15" fill="#257c78" font-weight="400">-63.02 mm</text><text x="32" y="299" font-size="18" fill="#203748" font-weight="400">Zigbee supply after D3</text><rect x="310" y="283" width="292.7442" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="302" width="21.647640000000003" height="12" rx="2" fill="#257c78"/><text x="956" y="298" font-size="18" fill="#203748" font-weight="400">69.70 → 5.15 mm</text><text x="956" y="321" font-size="15" fill="#257c78" font-weight="400">-64.55 mm</text><text x="32" y="375" font-size="18" fill="#203748" font-weight="400">S3 supply after D1</text><rect x="310" y="359" width="76.9587" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="378" width="62.29272" height="12" rx="2" fill="#257c78"/><text x="956" y="374" font-size="18" fill="#203748" font-weight="400">18.32 → 14.83 mm</text><text x="956" y="397" font-size="15" fill="#257c78" font-weight="400">-3.49 mm</text><text x="32" y="451" font-size="18" fill="#203748" font-weight="400">Shared 5 V network</text><rect x="310" y="435" width="300.25968" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="454" width="434.46018" height="12" rx="2" fill="#ab671f"/><text x="956" y="450" font-size="18" fill="#203748" font-weight="400">71.49 → 103.44 mm</text><text x="956" y="473" font-size="15" fill="#ab671f" font-weight="400">+31.95 mm</text><text x="32" y="527" font-size="18" fill="#203748" font-weight="400">Peripheral 3.3 V network</text><rect x="310" y="511" width="474.51558" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="530" width="606.52788" height="12" rx="2" fill="#ab671f"/><text x="956" y="526" font-size="18" fill="#203748" font-weight="400">112.98 → 144.41 mm</text><text x="956" y="549" font-size="15" fill="#ab671f" font-weight="400">+31.43 mm</text><text x="32" y="603" font-size="18" fill="#203748" font-weight="400">RF chip-select network</text><rect x="310" y="587" width="281.18622" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="606" width="159.25308" height="12" rx="2" fill="#257c78"/><text x="956" y="602" font-size="18" fill="#203748" font-weight="400">66.95 → 37.92 mm</text><text x="956" y="625" font-size="15" fill="#257c78" font-weight="400">-29.03 mm</text><text x="32" y="679" font-size="18" fill="#203748" font-weight="400">SPI MOSI network</text><rect x="310" y="663" width="494.37444000000005" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="682" width="519.81678" height="12" rx="2" fill="#ab671f"/><text x="956" y="678" font-size="18" fill="#203748" font-weight="400">117.71 → 123.77 mm</text><text x="956" y="701" font-size="15" fill="#ab671f" font-weight="400">+6.06 mm</text><text x="32" y="755" font-size="18" fill="#203748" font-weight="400">SPI MISO network</text><rect x="310" y="739" width="382.79220000000004" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="758" width="432.26988000000006" height="12" rx="2" fill="#ab671f"/><text x="956" y="754" font-size="18" fill="#203748" font-weight="400">91.14 → 102.92 mm</text><text x="956" y="777" font-size="15" fill="#ab671f" font-weight="400">+11.78 mm</text><text x="32" y="831" font-size="18" fill="#203748" font-weight="400">SPI clock network</text><rect x="310" y="815" width="449.70366" height="12" rx="2" fill="#a6b5c2"/><rect x="310" y="834" width="475.11366" height="12" rx="2" fill="#ab671f"/><text x="956" y="830" font-size="18" fill="#203748" font-weight="400">107.07 → 113.12 mm</text><text x="956" y="853" font-size="15" fill="#ab671f" font-weight="400">+6.05 mm</text><text x="32" y="918" font-size="18" fill="#203748" font-weight="400">Totals include every branch in each named net. They are not single source-to-load distances.</text><text x="32" y="948" font-size="18" fill="#203748" font-weight="400">Copper pours, module internals, through-hole barrels and external harnesses are excluded.</text><text x="32" y="978" font-size="17" fill="#203748" font-weight="400">Shorter total routing is not proof of signal integrity or a global optimum. Full per-net data are linked in the guide.</text></g></svg>