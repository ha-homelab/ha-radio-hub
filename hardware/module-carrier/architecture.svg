<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="875" viewBox="0 0 1320 875" role="img" aria-label="MC1 one carrier architecture"><rect width="1320" height="875" fill="#fff"/><g font-family="Arial,sans-serif"><text x="36" y="47" font-size="32" fill="#203748" font-weight="700">MC1 · one current module carrier</text><text x="36" y="82" font-size="19" fill="#203748" font-weight="400">One Ethernet uplink · local Thread BR · Ember Zigbee · direct-solder module pins</text><rect x="36" y="122" width="1248" height="103" rx="8" fill="#f5f1e9" stroke="#7894a4"/><text x="54" y="154" font-size="21" fill="#203748" font-weight="700">Finished isolated power</text><text x="54" y="187" font-size="17" fill="#203748" font-weight="400">PoE splitter → fused 5 V → individual controller inputs; finished 3.3 V buck → peripheral rail</text><polyline points="318,360 425,360" fill="none" stroke="#2c698d" stroke-width="3"/><polyline points="805,344 948,344" fill="none" stroke="#2c698d" stroke-width="3"/><polyline points="805,458 865,458 865,536 948,536" fill="none" stroke="#2c698d" stroke-width="3"/><polyline points="318,552 369,552 369,460 425,460" fill="none" stroke="#2c698d" stroke-width="3"/><polyline points="600,550 600,666" fill="none" stroke="#2c698d" stroke-width="3"/><polyline points="425,515 405,515 405,735 385,735" fill="none" stroke="#2c698d" stroke-width="3"/><rect x="36" y="287" width="282" height="148" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="54" y="319" font-size="21" fill="#203748" font-weight="700">WIZ850io</text><text x="54" y="352" font-size="17" fill="#203748" font-weight="400">Finished Ethernet module</text><text x="54" y="377" font-size="17" fill="#203748" font-weight="400">Shared SPI · own CS</text><text x="54" y="402" font-size="17" fill="#203748" font-weight="400">No raw PoE on its headers</text><rect x="425" y="278" width="380" height="272" rx="8" fill="#e4eff7" stroke="#7894a4"/><text x="443" y="310" font-size="21" fill="#203748" font-weight="700">S3 · local host</text><text x="443" y="343" font-size="17" fill="#203748" font-weight="400">Waveshare ESP32-S3-Nano-M</text><text x="443" y="368" font-size="17" fill="#203748" font-weight="400">16 MB flash + 8 MB PSRAM</text><text x="443" y="393" font-size="17" fill="#203748" font-weight="400">Local Thread BR + 3 active BLE</text><text x="443" y="418" font-size="17" fill="#203748" font-weight="400">Shared SPI, three native UARTs</text><text x="443" y="443" font-size="17" fill="#203748" font-weight="400">Native USB + BOOT service</text><rect x="948" y="277" width="336" height="140" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="966" y="309" font-size="21" fill="#203748" font-weight="700">H2 · Thread RCP</text><text x="966" y="342" font-size="17" fill="#203748" font-weight="400">ESP32-H2-DevKitM-1</text><text x="966" y="367" font-size="17" fill="#203748" font-weight="400">Dedicated UART; EN + BOOT</text><text x="966" y="392" font-size="17" fill="#203748" font-weight="400">Independent 802.15.4 radio</text><rect x="948" y="468" width="336" height="140" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="966" y="500" font-size="21" fill="#203748" font-weight="700">XIAO MG24 · Zigbee</text><text x="966" y="533" font-size="17" fill="#203748" font-weight="400">Ember NCP, not ZBOSS</text><text x="966" y="558" font-size="17" fill="#203748" font-weight="400">TX/RX + hardware RTS/CTS</text><text x="966" y="583" font-size="17" fill="#203748" font-weight="400">Native onboard programming</text><rect x="36" y="474" width="282" height="155" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="54" y="506" font-size="21" fill="#203748" font-weight="700">CC1101 · existing RF</text><text x="54" y="539" font-size="17" fill="#203748" font-weight="400">433 MHz TX + RX</text><text x="54" y="564" font-size="17" fill="#203748" font-weight="400">SPI + two GDO signals</text><text x="54" y="589" font-size="17" fill="#203748" font-weight="400">Hardware-timed S3 I/O</text><rect x="425" y="666" width="400" height="130" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="443" y="698" font-size="21" fill="#203748" font-weight="700">Finished WK2132 UART bridge</text><text x="443" y="731" font-size="17" fill="#203748" font-weight="400">DFR0627, I2C + checked forwarding</text><text x="443" y="756" font-size="17" fill="#203748" font-weight="400">Existing ZAC93 Z-Wave UART</text><rect x="36" y="670" width="349" height="126" rx="8" fill="#eff5f8" stroke="#7894a4"/><text x="54" y="702" font-size="21" fill="#203748" font-weight="700">LD2450 + BME680</text><text x="54" y="735" font-size="17" fill="#203748" font-weight="400">Radar: native UART, 5 V supply</text><text x="54" y="760" font-size="17" fill="#203748" font-weight="400">Environment: I2C, external pod</text><rect x="948" y="666" width="336" height="130" rx="8" fill="#edf3ed" stroke="#7894a4"/><text x="966" y="698" font-size="21" fill="#203748" font-weight="700">One custom board</text><text x="966" y="731" font-size="17" fill="#203748" font-weight="400">Modules + labeled harnesses</text><text x="966" y="756" font-size="17" fill="#203748" font-weight="400">No female module sockets</text><text x="966" y="781" font-size="17" fill="#203748" font-weight="400">No separate integrated variant</text><text x="36" y="847" font-size="16" fill="#203748" font-weight="400">Logical topology, not wire routing or measured performance. Use the native CAD for actual connector positions.</text></g></svg>