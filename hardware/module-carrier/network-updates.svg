<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="565" viewBox="0 0 1280 565" role="img" aria-label="Initial programming and network updates for the three controllers"><rect width="1280" height="565" fill="#fff"/><g font-family="Arial,sans-serif"><text x="32" y="48" font-size="28" fill="#203748" font-weight="700">Program loose modules first. Update through Ethernet afterwards.</text><rect x="32" y="85" width="1216" height="100" rx="8" fill="#f5f1e9" stroke="#7894a4"/><text x="50" y="117" font-size="21" fill="#203748" font-weight="700">Before permanent soldering</text><text x="50" y="150" font-size="17" fill="#203748" font-weight="400">Prepare the specified H2 revision (R7 isolation), install all three matching images, then verify the update paths.</text><rect x="32" y="220" width="382" height="205" rx="8" fill="#e4eff7" stroke="#7894a4"/><text x="50" y="252" font-size="21" fill="#203748" font-weight="700">S3 host</text><text x="50" y="285" font-size="17" fill="#203748" font-weight="400">Ethernet → ESPHome OTA</text><text x="50" y="310" font-size="17" fill="#203748" font-weight="400">Normal application updates</text><text x="50" y="335" font-size="17" fill="#203748" font-weight="400">No USB cable space reserved</text><text x="50" y="360" font-size="17" fill="#203748" font-weight="400">Failed bootloader or lost network:</text><text x="50" y="385" font-size="17" fill="#203748" font-weight="400">physical recovery may be needed.</text><rect x="449" y="220" width="382" height="205" rx="8" fill="#eaf4ed" stroke="#7894a4"/><text x="467" y="252" font-size="21" fill="#203748" font-weight="700">H2 Thread radio</text><text x="467" y="285" font-size="17" fill="#203748" font-weight="400">Ethernet → S3 → H2 ROM UART</text><text x="467" y="310" font-size="17" fill="#203748" font-weight="400">S3 controls BOOT and RESET</text><text x="467" y="335" font-size="17" fill="#203748" font-weight="400">H2 RX23 / TX24; R7 removed</text><text x="467" y="360" font-size="17" fill="#203748" font-weight="400">Explicitly armed update session</text><text x="467" y="385" font-size="17" fill="#203748" font-weight="400">Thread remains paused during update.</text><rect x="866" y="220" width="382" height="205" rx="8" fill="#edf0f8" stroke="#7894a4"/><text x="884" y="252" font-size="21" fill="#203748" font-weight="700">MG24 Zigbee radio</text><text x="884" y="285" font-size="17" fill="#203748" font-weight="400">Ethernet → S3 UART bridge</text><text x="884" y="310" font-size="17" fill="#203748" font-weight="400">Ember software bootloader entry</text><text x="884" y="335" font-size="17" fill="#203748" font-weight="400">GBL application update</text><text x="884" y="360" font-size="17" fill="#203748" font-weight="400">Stop ZHA / Zigbee2MQTT first</text><text x="884" y="385" font-size="17" fill="#203748" font-weight="400">Bootloader must remain intact.</text><text x="32" y="481" font-size="18" fill="#203748" font-weight="700">J8 / J9 remain unpopulated local recovery pads. They add no fitted header or USB cable corridor.</text><text x="32" y="526" font-size="17" fill="#203748" font-weight="400">Network update support does not guarantee recovery from every hardware, bootloader or power-loss failure.</text></g></svg>