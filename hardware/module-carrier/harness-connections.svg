<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840" role="img" aria-label="MC1 external harness connector map"><rect width="1440" height="1840" fill="#f5f8fa"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="32" fill="#203748" font-weight="700">MC1 · external connections</text><text x="36" y="85" font-size="20" fill="#203748" font-weight="400">Seven rear male headers · exact carrier pads and nets · external modules remain external</text><text x="36" y="116" font-size="17" fill="#203748" font-weight="400">Logical wiring map, not a connector face view. Find physical pin 1 in the mirrored rear CAD drawing.</text><rect x="36" y="155" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="56" y="189" font-size="23" fill="#203748" font-weight="700">J1 · Isolated 5 V input</text><text x="56" y="221" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="175" y="221" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="371" y="221" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="56" y="250" font-size="18" fill="#203748" font-weight="700">J1.1</text><text x="175" y="250" font-size="18" fill="#a43e37" font-weight="400">+5V</text><text x="371" y="250" font-size="17" fill="#203748" font-weight="400">Fused splitter +5 V</text><text x="56" y="277" font-size="18" fill="#203748" font-weight="700">J1.2</text><text x="175" y="277" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="371" y="277" font-size="17" fill="#203748" font-weight="400">Splitter ground</text><text x="56" y="474" font-size="16" fill="#486577" font-weight="400">Only isolated, regulated 5 V enters this header.</text><text x="56" y="497" font-size="16" fill="#486577" font-weight="400">WIZ850io does not extract PoE.</text><rect x="736" y="155" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="756" y="189" font-size="23" fill="#203748" font-weight="700">J2 · D24V22F3 regulator</text><text x="756" y="221" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="875" y="221" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="1071" y="221" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="756" y="250" font-size="18" fill="#203748" font-weight="700">J2.1</text><text x="875" y="250" font-size="18" fill="#a43e37" font-weight="400">+5V</text><text x="1071" y="250" font-size="17" fill="#203748" font-weight="400">Buck VIN</text><text x="756" y="277" font-size="18" fill="#203748" font-weight="700">J2.2</text><text x="875" y="277" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="1071" y="277" font-size="17" fill="#203748" font-weight="400">Buck GND</text><text x="756" y="304" font-size="18" fill="#203748" font-weight="700">J2.3</text><text x="875" y="304" font-size="18" fill="#987015" font-weight="400">+3V3</text><text x="1071" y="304" font-size="17" fill="#203748" font-weight="400">Buck VOUT, 3.3 V</text><text x="756" y="331" font-size="18" fill="#203748" font-weight="700">J2.4</text><text x="875" y="331" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="1071" y="331" font-size="17" fill="#203748" font-weight="400">Buck GND</text><text x="756" y="474" font-size="16" fill="#486577" font-weight="400">This is a harness to a separate finished regulator.</text><text x="756" y="497" font-size="16" fill="#486577" font-weight="400">Do not join the controllers’ local 3V3 outputs.</text><rect x="36" y="540" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="56" y="574" font-size="23" fill="#203748" font-weight="700">J3 · DFR0627 / WK2132</text><text x="56" y="606" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="175" y="606" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="371" y="606" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="56" y="635" font-size="18" fill="#203748" font-weight="700">J3.1</text><text x="175" y="635" font-size="18" fill="#987015" font-weight="400">+3V3</text><text x="371" y="635" font-size="17" fill="#203748" font-weight="400">Module VCC, 3.3 V</text><text x="56" y="662" font-size="18" fill="#203748" font-weight="700">J3.2</text><text x="175" y="662" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="371" y="662" font-size="17" fill="#203748" font-weight="400">Module GND</text><text x="56" y="689" font-size="18" fill="#203748" font-weight="700">J3.3</text><text x="175" y="689" font-size="18" fill="#226c9b" font-weight="400">I2C_SDA</text><text x="371" y="689" font-size="17" fill="#203748" font-weight="400">Module SDA</text><text x="56" y="716" font-size="18" fill="#203748" font-weight="700">J3.4</text><text x="175" y="716" font-size="18" fill="#226c9b" font-weight="400">I2C_SCL</text><text x="371" y="716" font-size="17" fill="#203748" font-weight="400">Module SCL</text><text x="56" y="743" font-size="18" fill="#203748" font-weight="700">J3.5</text><text x="175" y="743" font-size="18" fill="#226c9b" font-weight="400">ZWAVE_RX</text><text x="371" y="743" font-size="17" fill="#203748" font-weight="400">Module TX1 → ZAC93 RX</text><text x="56" y="770" font-size="18" fill="#203748" font-weight="700">J3.6</text><text x="175" y="770" font-size="18" fill="#226c9b" font-weight="400">ZWAVE_TX</text><text x="371" y="770" font-size="17" fill="#203748" font-weight="400">Module RX1 ← ZAC93 TX</text><text x="56" y="859" font-size="16" fill="#486577" font-weight="400">IA1 = 1, IA0 = 1; register 0x70, FIFO 0x71.</text><text x="56" y="882" font-size="16" fill="#486577" font-weight="400">Identify physical module labels before wiring.</text><rect x="736" y="540" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="756" y="574" font-size="23" fill="#203748" font-weight="700">J4 · ZAC93 Z-Wave</text><text x="756" y="606" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="875" y="606" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="1071" y="606" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="756" y="635" font-size="18" fill="#203748" font-weight="700">J4.1</text><text x="875" y="635" font-size="18" fill="#987015" font-weight="400">+3V3</text><text x="1071" y="635" font-size="17" fill="#203748" font-weight="400">ZAC93 pin 1</text><text x="756" y="662" font-size="18" fill="#203748" font-weight="700">J4.2</text><text x="875" y="662" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="1071" y="662" font-size="17" fill="#203748" font-weight="400">ZAC93 pin 6</text><text x="756" y="689" font-size="18" fill="#203748" font-weight="700">J4.3</text><text x="875" y="689" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="1071" y="689" font-size="17" fill="#203748" font-weight="400">ZAC93 pin 9</text><text x="756" y="716" font-size="18" fill="#203748" font-weight="700">J4.4</text><text x="875" y="716" font-size="18" fill="#226c9b" font-weight="400">ZWAVE_RX</text><text x="1071" y="716" font-size="17" fill="#203748" font-weight="400">ZAC93 pin 8, RX</text><text x="756" y="743" font-size="18" fill="#203748" font-weight="700">J4.5</text><text x="875" y="743" font-size="18" fill="#226c9b" font-weight="400">ZWAVE_TX</text><text x="1071" y="743" font-size="17" fill="#203748" font-weight="400">ZAC93 pin 10, TX</text><text x="756" y="859" font-size="16" fill="#486577" font-weight="400">Carrier pin numbers are NOT ZAC93 pin numbers.</text><text x="756" y="882" font-size="16" fill="#486577" font-weight="400">UART goes through J3, the external WK2132.</text><rect x="36" y="925" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="56" y="959" font-size="23" fill="#203748" font-weight="700">J5 · CC1101 radio</text><text x="56" y="991" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="175" y="991" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="371" y="991" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="56" y="1020" font-size="18" fill="#203748" font-weight="700">J5.1</text><text x="175" y="1020" font-size="18" fill="#987015" font-weight="400">+3V3</text><text x="371" y="1020" font-size="17" fill="#203748" font-weight="400">Module VCC, 3.3 V</text><text x="56" y="1047" font-size="18" fill="#203748" font-weight="700">J5.2</text><text x="175" y="1047" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="371" y="1047" font-size="17" fill="#203748" font-weight="400">Module GND</text><text x="56" y="1074" font-size="18" fill="#203748" font-weight="700">J5.3</text><text x="175" y="1074" font-size="18" fill="#226c9b" font-weight="400">SPI_SCK</text><text x="371" y="1074" font-size="17" fill="#203748" font-weight="400">SCK</text><text x="56" y="1101" font-size="18" fill="#203748" font-weight="700">J5.4</text><text x="175" y="1101" font-size="18" fill="#226c9b" font-weight="400">SPI_MOSI</text><text x="371" y="1101" font-size="17" fill="#203748" font-weight="400">MOSI</text><text x="56" y="1128" font-size="18" fill="#203748" font-weight="700">J5.5</text><text x="175" y="1128" font-size="18" fill="#226c9b" font-weight="400">SPI_MISO</text><text x="371" y="1128" font-size="17" fill="#203748" font-weight="400">MISO</text><text x="56" y="1155" font-size="18" fill="#203748" font-weight="700">J5.6</text><text x="175" y="1155" font-size="18" fill="#226c9b" font-weight="400">RF_CS</text><text x="371" y="1155" font-size="17" fill="#203748" font-weight="400">CSn</text><text x="56" y="1182" font-size="18" fill="#203748" font-weight="700">J5.7</text><text x="175" y="1182" font-size="18" fill="#226c9b" font-weight="400">RF_GDO0</text><text x="371" y="1182" font-size="17" fill="#203748" font-weight="400">GDO0</text><text x="56" y="1209" font-size="18" fill="#203748" font-weight="700">J5.8</text><text x="175" y="1209" font-size="18" fill="#226c9b" font-weight="400">RF_GDO2</text><text x="371" y="1209" font-size="17" fill="#203748" font-weight="400">GDO2</text><text x="56" y="1244" font-size="16" fill="#486577" font-weight="400">Shared SPI with WIZ850io; independent CS.</text><text x="56" y="1267" font-size="16" fill="#486577" font-weight="400">Use signal labels: clone header numbering varies.</text><rect x="736" y="925" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="756" y="959" font-size="23" fill="#203748" font-weight="700">J6 · LD2450 radar</text><text x="756" y="991" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="875" y="991" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="1071" y="991" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="756" y="1020" font-size="18" fill="#203748" font-weight="700">J6.1</text><text x="875" y="1020" font-size="18" fill="#a43e37" font-weight="400">+5V</text><text x="1071" y="1020" font-size="17" fill="#203748" font-weight="400">Radar 5 V</text><text x="756" y="1047" font-size="18" fill="#203748" font-weight="700">J6.2</text><text x="875" y="1047" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="1071" y="1047" font-size="17" fill="#203748" font-weight="400">Radar GND</text><text x="756" y="1074" font-size="18" fill="#203748" font-weight="700">J6.3</text><text x="875" y="1074" font-size="18" fill="#226c9b" font-weight="400">RADAR_RX</text><text x="1071" y="1074" font-size="17" fill="#203748" font-weight="400">Radar RX ← S3 TX</text><text x="756" y="1101" font-size="18" fill="#203748" font-weight="700">J6.4</text><text x="875" y="1101" font-size="18" fill="#226c9b" font-weight="400">RADAR_TX</text><text x="1071" y="1101" font-size="17" fill="#203748" font-weight="400">Radar TX → S3 RX</text><text x="756" y="1244" font-size="16" fill="#486577" font-weight="400">5 V power with 3.3 V data signals.</text><text x="756" y="1267" font-size="16" fill="#486577" font-weight="400">Do not infer direction from net suffix alone.</text><rect x="36" y="1310" width="668" height="363" rx="12" fill="white" stroke="#cad6df"/><text x="56" y="1344" font-size="23" fill="#203748" font-weight="700">J7 · BME680 external pod</text><text x="56" y="1376" font-size="14" fill="#677e8e" font-weight="400">Carrier pad</text><text x="175" y="1376" font-size="14" fill="#677e8e" font-weight="400">Net</text><text x="371" y="1376" font-size="14" fill="#677e8e" font-weight="400">Off-board destination</text><text x="56" y="1405" font-size="18" fill="#203748" font-weight="700">J7.1</text><text x="175" y="1405" font-size="18" fill="#50616f" font-weight="400">GND</text><text x="371" y="1405" font-size="17" fill="#203748" font-weight="400">Sensor GND</text><text x="56" y="1432" font-size="18" fill="#203748" font-weight="700">J7.2</text><text x="175" y="1432" font-size="18" fill="#987015" font-weight="400">+3V3</text><text x="371" y="1432" font-size="17" fill="#203748" font-weight="400">Sensor VDD, 3.3 V</text><text x="56" y="1459" font-size="18" fill="#203748" font-weight="700">J7.3</text><text x="175" y="1459" font-size="18" fill="#226c9b" font-weight="400">I2C_SDA</text><text x="371" y="1459" font-size="17" fill="#203748" font-weight="400">Sensor SDA</text><text x="56" y="1486" font-size="18" fill="#203748" font-weight="700">J7.4</text><text x="175" y="1486" font-size="18" fill="#226c9b" font-weight="400">I2C_SCL</text><text x="371" y="1486" font-size="17" fill="#203748" font-weight="400">Sensor SCL</text><text x="56" y="1629" font-size="16" fill="#486577" font-weight="400">Mount away from enclosure heat.</text><text x="56" y="1652" font-size="16" fill="#486577" font-weight="400">Check module pull-ups before adding any.</text><rect x="736" y="1310" width="668" height="363" rx="12" fill="#e7f2ec" stroke="#87ad96"/><text x="756" y="1346" font-size="22" fill="#203748" font-weight="700">Connections already on the PCB</text><text x="756" y="1385" font-size="18" fill="#203748" font-weight="400">U1 ↔ U2: Thread UART + EN + BOOT</text><text x="756" y="1424" font-size="18" fill="#203748" font-weight="400">U1 ↔ U3: Zigbee UART + RTS / CTS</text><text x="756" y="1463" font-size="18" fill="#203748" font-weight="400">U1 ↔ U4: shared SPI + CS + INT + RESET</text><text x="756" y="1502" font-size="18" fill="#203748" font-weight="400">D1–D3: separate controller 5 V branches</text><text x="756" y="1541" font-size="18" fill="#203748" font-weight="400">R1 / R2: RF pull-ups</text><text x="756" y="1580" font-size="18" fill="#203748" font-weight="400">J8 / J9: unpopulated recovery pads</text><text x="36" y="1724" font-size="20" fill="#203748" font-weight="700">Assembly: solder all rear components first; inspect and trim; then install front U1–U3.</text><text x="36" y="1765" font-size="18" fill="#203748" font-weight="400">H2 uses RX23 / TX24 with R7 removed on the specified DevKit revision. Preflash loose modules.</text><text x="36" y="1804" font-size="17" fill="#203748" font-weight="400">Verify continuity, polarity and loaded rails before connecting peripherals. This map is not a hardware test result.</text></g></svg>