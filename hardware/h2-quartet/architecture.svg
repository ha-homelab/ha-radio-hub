<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1100" role="img" aria-label="H2 Quartet: finished modules on a through-hole carrier">
<style>text{font-family:Arial,sans-serif;fill:#182d3c}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526879}.node{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526879}.module{fill:#f2f7fb;stroke:#7196b2;stroke-width:2}.host{fill:#e0eff9;stroke:#236b98;stroke-width:3}.peripheral{fill:#f4f8f2;stroke:#759270;stroke-width:2}.power{fill:#fbf1e8;stroke:#b18051;stroke-width:2}.bus{fill:none;stroke:#236b98;stroke-width:3}.uart{fill:none;stroke:#658554;stroke-width:3}.outline{fill:#fff;stroke:#b5c6d0;stroke-width:2}.board{fill:#e6ede5;stroke:#6a8465;stroke-width:2}</style>
<rect width="1320" height="1100" fill="#fff"/><text x="45" y="53" class="title">H2 Quartet</text><text x="45" y="84" class="sub">Four finished H2 boards. One Ethernet. Through-hole carrier.</text><text x="45" y="113" class="small">Candidate architecture • 17 Oct 2026 • full firmware and hardware not validated</text><rect x="45" y="145" width="1230" height="109" rx="9" class="power"/><text x="63" y="176" class="node">Finished power modules</text><text x="63" y="204" class="body">Active isolated PoE splitter → regulated 5 V → H2 board inputs + LD2450</text><text x="63" y="227" class="body">Assembled 3.3 V converter → WIZ850io + CC1101 + ZAC93 + BME680; common secondary ground</text><polyline points="305,370 390,370 390,410 470,410" class="bus"/><polyline points="305,560 390,560 390,410" class="bus"/><polyline points="390,560 390,735 475,735" class="bus"/><polyline points="790,365 930,365" class="uart"/><polyline points="790,450 860,450 860,545 930,545" class="uart"/><polyline points="650,845 650,905" class="uart"/><rect x="45" y="310" width="260" height="130" rx="9" class="module"/><text x="63" y="341" class="node">WIZ850io</text><text x="63" y="369" class="body">Assembled W5500 + RJ45</text><text x="63" y="392" class="body">SPI / raw Ethernet</text><text x="63" y="415" class="body">One external network link</text><rect x="45" y="500" width="260" height="135" rx="9" class="module"/><text x="63" y="531" class="node">Existing CC1101</text><text x="63" y="559" class="body">433 MHz RF module</text><text x="63" y="582" class="body">Shared SPI; own CS</text><text x="63" y="605" class="body">RMT TX + RX on A</text><rect x="470" y="305" width="320" height="205" rx="9" class="host"/><text x="488" y="336" class="node">A · H2 gateway</text><text x="488" y="364" class="body">Ethernet + BLE + RF</text><text x="488" y="387" class="body">Thread host/BR port pending</text><text x="488" y="410" class="body">14 working GPIO</text><text x="488" y="433" class="body">One shared SPI master bus</text><text x="488" y="456" class="body">No local Linux or switch</text><rect x="930" y="300" width="345" height="135" rx="9" class="module"/><text x="948" y="331" class="node">B · H2 Thread radio</text><text x="948" y="359" class="body">Standard RCP / Spinel UART</text><text x="948" y="382" class="body">Separate 802.15.4 radio</text><text x="948" y="405" class="body">Own native USB programming</text><rect x="930" y="480" width="345" height="135" rx="9" class="module"/><text x="948" y="511" class="node">C · H2 Zigbee radio</text><text x="948" y="539" class="body">ZBOSS NCP / two-wire UART</text><text x="948" y="562" class="body">One Zigbee2MQTT client</text><text x="948" y="585" class="body">Host compatibility needs testing</text><rect x="475" y="675" width="350" height="170" rx="9" class="peripheral"/><text x="493" y="706" class="node">D · H2 peripheral controller</text><text x="493" y="734" class="body">SPI slave + READY handshake</text><text x="493" y="757" class="body">Two independent hardware UARTs</text><text x="493" y="780" class="body">BME680 via I2C</text><text x="493" y="803" class="body">2.4 GHz radio off</text><rect x="350" y="905" width="610" height="106" rx="9" class="peripheral"/><text x="368" y="936" class="node">Existing peripheral boards</text><text x="368" y="964" class="body">LD2450 (256000 baud) · ZAC93 (115200 baud) · BME680</text><text x="368" y="987" class="body">Local radar parsing and bounded per-channel queues</text><text x="318" y="294" class="small">Blue: shared SPI</text><text x="818" y="285" class="small">Green: serial / I2C</text><text x="800" y="354" class="small">UART</text><text x="870" y="532" class="small">UART</text><text x="45" y="680" class="node">Four identical H2 boards:</text><text x="45" y="714" class="body">$20 at the user’s $5 assumption</text><text x="45" y="744" class="small">Other modules and carrier extra.</text><text x="885" y="707" class="node">Direct through-hole mounting</text><text x="885" y="738" class="body">Factory pins enter plated holes.</text><text x="885" y="764" class="body">No castellated-side soldering.</text><text x="885" y="790" class="body">Extra stack height is accepted.</text><text x="45" y="1052" class="small">Alternative software: A native Thread + B full BLE proxy; same module concept, new UART API transport required.</text><text x="45" y="1077" class="small">Power wires, pull-ups, exact connector orientation and board dimensions omitted. This is not a fabrication drawing.</text></svg>