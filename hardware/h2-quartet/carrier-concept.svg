<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 675" role="img" aria-label="Through-hole carrier assembly concept">
<style>text{font-family:Arial,sans-serif;fill:#182d3c}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526879}.node{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526879}.module{fill:#f2f7fb;stroke:#7196b2;stroke-width:2}.host{fill:#e0eff9;stroke:#236b98;stroke-width:3}.peripheral{fill:#f4f8f2;stroke:#759270;stroke-width:2}.power{fill:#fbf1e8;stroke:#b18051;stroke-width:2}.bus{fill:none;stroke:#236b98;stroke-width:3}.uart{fill:none;stroke:#658554;stroke-width:3}.outline{fill:#fff;stroke:#b5c6d0;stroke-width:2}.board{fill:#e6ede5;stroke:#6a8465;stroke-width:2}</style>
<rect width="1320" height="675" fill="#fff"/><text x="45" y="53" class="title">Factory modules on a simple carrier</text><text x="45" y="88" class="sub">Concept only — footprints, row spacing and clearances require the exact boards</text><rect x="45" y="135" width="1230" height="245" rx="12" class="board"/><rect x="85" y="172" width="240" height="135" rx="9" class="module"/><text x="103" y="203" class="node">A · gateway</text><text x="103" y="231" class="body">Finished H2-Zero-M</text><text x="103" y="254" class="body">Factory male headers</text><text x="103" y="277" class="body">Pins soldered to carrier</text><rect x="375" y="172" width="240" height="135" rx="9" class="module"/><text x="393" y="203" class="node">B · Thread</text><text x="393" y="231" class="body">Finished H2-Zero-M</text><text x="393" y="254" class="body">Factory male headers</text><text x="393" y="277" class="body">Pins soldered to carrier</text><rect x="665" y="172" width="240" height="135" rx="9" class="module"/><text x="683" y="203" class="node">C · Zigbee</text><text x="683" y="231" class="body">Finished H2-Zero-M</text><text x="683" y="254" class="body">Factory male headers</text><text x="683" y="277" class="body">Pins soldered to carrier</text><rect x="955" y="172" width="240" height="135" rx="9" class="module"/><text x="973" y="203" class="node">D · peripherals</text><text x="973" y="231" class="body">Finished H2-Zero-M</text><text x="973" y="254" class="body">Factory male headers</text><text x="973" y="277" class="body">Pins soldered to carrier</text><text x="70" y="353" class="body">Top view, not to scale: route only interconnect and power; keep antenna areas free of carrier copper.</text><text x="45" y="429" class="node">Side section through one module</text><rect x="120" y="465" width="470" height="20" class="module"/><rect x="120" y="562" width="470" height="15" class="board"/><rect x="170" y="485" width="8" height="120" fill="#aa8348"/><ellipse cx="174" cy="580" rx="13" ry="6" fill="#84929c"/><rect x="500" y="485" width="8" height="120" fill="#aa8348"/><ellipse cx="504" cy="580" rx="13" ry="6" fill="#84929c"/><text x="670" y="482" class="body">Ready-made module: leave factory components intact</text><text x="670" y="531" class="body">Factory male pins: no female sockets</text><text x="670" y="574" class="body">Carrier: plated through-holes and traces</text><text x="670" y="607" class="body">Solder factory male pins from the underside</text><text x="45" y="650" class="small">Selected construction: factory male pins soldered directly into plated carrier holes. No sockets or side-pad soldering.</text></svg>