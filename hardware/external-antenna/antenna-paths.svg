<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">MC2 — three separate external 2.4 GHz antennas</title>
<desc id="desc">BLE, Thread and Zigbee each have a dedicated U.FL cable, standard SMA bulkhead and 2.4 GHz antenna. The modules are on a 100 by 100 mm carrier. Logical diagram, not a mechanical drawing.</desc>
<rect width="1080" height="560" rx="24" fill="#101e2f"/>
<g font-family="Arial,sans-serif" fill="#eff6ff"><text x="40" y="51" font-size="28" font-weight="700">MC2 / THREE INDEPENDENT RF PATHS</text>
<text x="40" y="83" font-size="16" fill="#b8c9dd">2.4 GHz · 50 Ω · standard SMA · one antenna per radio</text>
<rect x="28" y="220" width="1024" height="234" rx="16" fill="#1a2b41" stroke="#52637b"/>
<path d="M205 132 v65" stroke="#2dd4bf" stroke-width="13" stroke-linecap="round"/>
<circle cx="205" cy="217" r="9" fill="#2dd4bf"/>
<path d="M205 226 v58" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="7 4"/>
<text x="205" y="119" text-anchor="middle" fill="#2dd4bf" font-size="20" font-weight="700">BLE</text>
<rect x="61" y="290" width="288" height="125" rx="12" fill="#0c1726" stroke="#2dd4bf"/>
<text x="205" y="325" text-anchor="middle" fill="#2dd4bf" font-size="17" font-weight="700">ESP32-S3-DevKitC-1U</text>
<text x="205" y="355" text-anchor="middle" font-size="16">BLE + host services</text>
<text x="205" y="387" text-anchor="middle" font-size="14" fill="#b8c9dd">Factory external RF</text>
