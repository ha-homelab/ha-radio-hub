<text x="875" y="325" text-anchor="middle" fill="#c084fc" font-size="17" font-weight="700">XIAO MG24</text>
<text x="875" y="355" text-anchor="middle" font-size="16">Ember Zigbee NCP</text>
<text x="875" y="387" text-anchor="middle" font-size="14" fill="#b8c9dd">Firmware: PB04=1 / PB05=1</text>
<text x="540" y="439" text-anchor="middle" font-size="14" fill="#b8c9dd">Fixed base wall · 3 SMA bulkheads · dedicated 150 mm pigtails</text>
<text x="40" y="491" font-size="18">PoE switch → isolated splitter → regulated rails + WIZ850io Ethernet</text>
<text x="40" y="526" font-size="15" fill="#b8c9dd">Logical connections, not to scale. Printed case and 1,000 ft² coverage require physical testing.</text></g></svg>
