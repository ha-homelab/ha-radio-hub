<text x="540" y="119" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="700">THREAD</text>
<rect x="396" y="290" width="288" height="125" rx="12" fill="#0c1726" stroke="#60a5fa"/>
<text x="540" y="325" text-anchor="middle" fill="#60a5fa" font-size="17" font-weight="700">TinyC6-U-01</text>
<text x="540" y="355" text-anchor="middle" font-size="16">Thread RCP</text>
<text x="540" y="387" text-anchor="middle" font-size="14" fill="#b8c9dd">Factory external RF</text>
<path d="M875 132 v65" stroke="#c084fc" stroke-width="13" stroke-linecap="round"/>
