<text x="807" y="681" fill="#e4eef8" font-size="18" text-anchor="middle">J10: 1 EN · 2 BOOT</text>
<text x="1010" y="255" fill="#f5ca93" font-size="16" text-anchor="start">Real window</text>
<text x="1010" y="278" fill="#f5ca93" font-size="16" text-anchor="start">6 × 10.9 mm</text>
<text x="1010" y="301" fill="#f5ca93" font-size="16" text-anchor="start">R1.5 corners</text>
<text x="420" y="720" fill="#e4eef8" font-size="17" text-anchor="start">1  Solder / inspect with magnification before seating; use flux and short dwell.</text>
<text x="420" y="748" fill="#e4eef8" font-size="17" text-anchor="start">2  Route 30 AWG leads above carrier, between rows; retain a small slack loop.</text>
<text x="420" y="776" fill="#e4eef8" font-size="17" text-anchor="start">3  Keep ≥2.5 mm gap, wire OD ≤0.8 mm and joints ≤1.5 mm; strain-relieve.</text>
<text x="40" y="824" fill="#afc9dd" font-size="16" text-anchor="start">Nominal manufacturer pad positions, not a sample fit approval. Window remains open from below; verify no shorts before power.</text>
