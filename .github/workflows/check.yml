name: Prototype validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@77b0157695fb80e4d97c3ac4819c2d1db7ba96c7 # main
    with:
      force-full: false
  baseline:
    needs: ["scope"]
    name: Modular prototype
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline source and documentation checks
        run: |
          python3 tools/check.py
          python3 hardware/gallery/render.py --check
          python3 hardware/parts/build.py --check
          python3 -m unittest discover -s hardware/parts -p 'test_*.py'
          python3 -m unittest discover -s software -p 'test_*.py'
      - name: Install pinned prototype build dependencies
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r firmware/requirements.txt -r mechanical/requirements.txt -r mechanical/diy/requirements.txt
      - name: Check readable guide and connector lookup
        run: |
          python3 -m venv .venv-guide
          .venv-guide/bin/pip install -r guide/requirements.txt
          .venv-guide/bin/python -m unittest discover -s guide -p 'test_*.py'
          .venv-guide/bin/python guide/build.py --check
          python3 -m unittest discover -s hardware/external-antenna -p 'test_*.py'
          python3 hardware/external-antenna/power_design.py
      - name: Check DIY print scale, orientation and source freshness
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          .venv/bin/python -m unittest discover -s mechanical/diy -p 'test_*.py'
          .venv/bin/python mechanical/diy/build.py --check
      - name: RF contract and migration regressions
        if: ${{ needs.scope.outputs.run == 'true' }}
        env:
          RF_CPP_SANITIZERS: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate and compile the combined Ethernet sensor firmware
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: .venv/bin/python firmware/validate.py --esphome .venv/bin/esphome --compile
      - name: Validate and compile RF Airbridge over Ethernet
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          .venv/bin/python firmware/validate.py --esphome .venv/bin/esphome --config rf-ethernet.yaml
          .venv/bin/python firmware/validate.py --esphome .venv/bin/esphome --config rf-ethernet.yaml --migration-fixture --compile
      - name: Check committed CAD against its source and validate meshes
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: |
          .venv/bin/python -m unittest discover -s mechanical -p 'test_*.py'
          .venv/bin/python mechanical/build.py --check
      - name: Build the public release package from committed sources
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: python3 tools/package_release.py --version v0.0.0-ci --output .build/ci-release
      - name: Build the Linux serial service image
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: docker build -t ha-radio-hub/ser2net:ci software/ser2net
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
  low-power:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: Single-host low-power prototype
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned prototype dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r firmware/requirements.txt -r mechanical/requirements.txt -r firmware/low-power/requirements-test.txt
      - name: Check wiring and lifetime-energy model
        run: |
          python3 hardware/low-power/validate.py
          python3 hardware/low-power/visual/validate.py
          python3 -m unittest discover -s hardware/low-power/visual -p 'test_*.py'
          python3 -m unittest discover -s hardware/low-power/visual/physical -p 'test_*.py'
          python3 hardware/low-power/visual/physical/build.py --check
          python3 hardware/low-power/visual/build.py --check
          python3 tools/energy.py plan --years 15
      - name: Compile all services in one S3 image
        run: .venv/bin/python firmware/low-power/validate.py --esphome .venv/bin/esphome --compile --output .build/low-power
      - name: Test actual REST handlers against the pinned Home Assistant client
        run: |
          IDF_SDK_PATH=$(.venv/bin/python -c 'import json; print(json.load(open(".build/low-power/firmware/low-power/.esphome/build/low-power-hub-proof/build/project_description.json"))["idf_path"])')
          .venv/bin/python firmware/low-power/test_rest_contract.py --prepared .build/low-power --idf "$IDF_SDK_PATH"
      - name: Build the matching H2 Thread radio firmware
        run: |
          IDF_PATH=$(.venv/bin/python -c 'import json; print(json.load(open(".build/low-power/firmware/low-power/.esphome/build/low-power-hub-proof/build/project_description.json"))["idf_path"])')
          export IDF_PATH
          export IDF_TOOLS_PATH="$RUNNER_TEMP/low-power-idf-h2"
          "$IDF_PATH/install.sh" esp32h2
          source "$IDF_PATH/export.sh"
          python "$GITHUB_WORKSPACE/firmware/low-power/prepare_h2.py" "$GITHUB_WORKSPACE/.build/h2" --idf "$IDF_PATH"
          idf.py -C "$GITHUB_WORKSPACE/.build/h2" -DIDF_TARGET=esp32h2 build
      - name: Check concept enclosure geometry and exports
        run: |
          .venv/bin/python -m unittest discover -s mechanical/low-power -p 'test_*.py'
          .venv/bin/python mechanical/low-power/build.py --check
  pcb:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: Carrier, integrated and DIY PCB validation
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      KICAD_IMAGE: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned official KiCad image
        run: docker pull "$KICAD_IMAGE"
      - name: Verify circuit contracts, native ERC, DRC and connectivity
        run: |
          docker run --rm --network none --env QT_QPA_PLATFORM=offscreen \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" --workdir /tmp \
            "$KICAD_IMAGE" bash -euc '
              cp -R /source /tmp/pcb-source
              cd /tmp/pcb-source
              kicad-cli version
              python3 -m unittest discover -s hardware/low-power/carrier -p "test_*.py"
              python3 hardware/low-power/carrier/validate.py --check-hashes --out /tmp/carrier-validation
              python3 -m unittest discover -s hardware/low-power/carrier/mg24-adapter -p "test_*.py"
              python3 hardware/low-power/carrier/mg24-adapter/validate.py --check-hashes --out /tmp/mg24-adapter-validation
              python3 -m unittest discover -s hardware/low-power/integrated -p "test_*.py"
              python3 hardware/low-power/integrated/validate.py
              python3 -m unittest discover -s hardware/low-power/diy -p "test_*.py"
              python3 hardware/low-power/diy/validate.py --check-hashes --out /tmp/diy-validation
              python3 -m unittest discover -s hardware/module-carrier/cad -p "test_*.py"
              kicad-cli sch erc --exit-code-violations --severity-all --format json --output /tmp/mc1-erc.json hardware/module-carrier/cad/mc1.kicad_sch
              # Keep the raw DRC report. The stacked MC1 prototype has exactly
              # 41 reviewed rear-tail/front-courtyard overlaps; every other
              # finding still fails, and physical Z clearance remains untested.
              python3 hardware/module-carrier/cad/validate_drc.py --cli kicad-cli --report /tmp/mc1-drc.json --output /tmp/mc1-classification.json
              kicad-cli sch erc --exit-code-violations --severity-all --format json --output hardware/external-antenna/cad/checks/erc.json hardware/external-antenna/cad/mc2.kicad_sch
              kicad-cli pcb drc --exit-code-violations --severity-all --schematic-parity --format json --output hardware/external-antenna/cad/checks/drc.json hardware/external-antenna/cad/mc2.kicad_pcb
              python3 hardware/external-antenna/cad/test_design.py
              python3 hardware/external-antenna/fabrication/package.py --check
              python3 -m unittest discover -s hardware/external-antenna/fabrication -p "test_*.py"
              python3 hardware/external-antenna/cad/reproduce_check.py --python python3 --cli kicad-cli --libraries /usr/share/kicad
            '
  check:
    name: check
    if: ${{ always() }}
    needs: ["baseline", "espnow", "external-antenna", "low-power", "mg24", "module-carrier", "pcb", "scope"]
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 2
    steps:
      - name: Require the exact selected validation path
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['baseline', 'espnow', 'external-antenna', 'low-power', 'mg24', 'module-carrier', 'pcb', 'scope']
          always = ['baseline', 'scope']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          failed = {}
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name in always else 'skipped'
              if value['result'] != wanted:
                  failed[name] = {'actual': value['result'], 'expected': wanted}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')

  mg24:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: MG24 Zigbee NCP and bootloader
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java and host runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y openjdk-21-jre-headless make unzip libgl1 libx11-xcb1 libxext6 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libgssapi-krb5-2 libxcb1 libxkbcommon-x11-0 libusb-1.0-0
      - name: Fetch verified SDK and tools
        run: python3 firmware/low-power/mg24/bootstrap_linux.py --output "$RUNNER_TEMP/ha-radio-mg24-tools"
      - name: Test image and configuration validation
        run: python3 -m unittest discover -s firmware/low-power/mg24 -p 'test_*.py'
      - name: Generate exact module and UART configuration
        run: |
          python3 firmware/low-power/mg24/generate.py \
            --sdk "$RUNNER_TEMP/ha-radio-mg24-tools/sdk" \
            --slc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/slc_cli/slc" \
            --python-pack "$RUNNER_TEMP/ha-radio-mg24-tools/tools/python" \
            --gcc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi" \
            --java-home /usr/lib/jvm/java-21-openjdk-amd64 \
            --output "$RUNNER_TEMP/ha-radio-mg24-build"
      - name: Build and verify NCP, bootloader and update images
        run: |
          python3 firmware/low-power/mg24/build.py \
            --project "$RUNNER_TEMP/ha-radio-mg24-build" \
            --gcc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi" \
            --commander "$RUNNER_TEMP/ha-radio-mg24-tools/tools/commander/commander"

      - name: Build and verify both XIAO MG24 antenna configurations
        run: |
          for antenna in onboard external; do
            python3 firmware/module-carrier/zigbee/generate.py \
              --antenna "$antenna" \
              --sdk "$RUNNER_TEMP/ha-radio-mg24-tools/sdk" \
              --slc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/slc_cli/slc" \
              --python-pack "$RUNNER_TEMP/ha-radio-mg24-tools/tools/python" \
              --gcc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi" \
              --java-home /usr/lib/jvm/java-21-openjdk-amd64 \
              --output "$RUNNER_TEMP/mg24-$antenna-build"
            python3 firmware/module-carrier/zigbee/build.py \
              --project "$RUNNER_TEMP/mg24-$antenna-build" \
              --gcc "$RUNNER_TEMP/ha-radio-mg24-tools/tools/arm-gnu-toolchain-12.2.rel1-x86_64-arm-none-eabi" \
              --commander "$RUNNER_TEMP/ha-radio-mg24-tools/tools/commander/commander"
          done

  module-carrier:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: MC1 historical regression
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check current drawings, images and interface contracts
        run: |
          python3 hardware/module-carrier/render.py --check
          python3 hardware/module-carrier/render_board.py --check
          python3 hardware/module-carrier/audit_carrier.py --self-test
          python3 -m unittest discover -s hardware/module-carrier -p 'test_*.py'
          python3 -m unittest discover -s firmware/module-carrier/zigbee -p 'test_*.py'
      - name: Exercise WK2132 forwarding under sanitizers
        env:
          RF_CPP_SANITIZERS: "1"
        run: python3 -m unittest discover -s firmware/module-carrier/tests -p 'test_*.py'
      - name: Install pinned ESPHome and mechanical dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r firmware/requirements.txt -r mechanical/requirements.txt
      - name: Check current carrier enclosure and rail geometry
        run: |
          .venv/bin/python -m unittest discover -s mechanical/module-carrier/rail-mount -p 'test_*.py'
          .venv/bin/python -m unittest discover -s mechanical/module-carrier/enclosure-prototype -p 'test_*.py'
          .venv/bin/python mechanical/module-carrier/rail-mount/build.py --check
          .venv/bin/python mechanical/module-carrier/enclosure-prototype/build.py --check
      - name: Compile the complete MC1 S3 image
        run: .venv/bin/python firmware/module-carrier/validate.py .build/mc1 --esphome .venv/bin/esphome --compile
      - name: Compile the remapped MC1 H2 RCP
        run: |
          IDF_PATH=$(.venv/bin/python -c 'import json; print(json.load(open(".build/mc1/firmware/module-carrier/.esphome/build/module-carrier-hub/build/project_description.json"))["idf_path"])')
          export IDF_PATH
          export IDF_TOOLS_PATH="$RUNNER_TEMP/mc1-idf-h2"
          "$IDF_PATH/install.sh" esp32h2
          source "$IDF_PATH/export.sh"
          python "$GITHUB_WORKSPACE/firmware/module-carrier/prepare_h2.py" "$GITHUB_WORKSPACE/.build/mc1-h2" --idf "$IDF_PATH"
          idf.py -C "$GITHUB_WORKSPACE/.build/mc1-h2" -DIDF_TARGET=esp32h2 build
          python "$GITHUB_WORKSPACE/firmware/module-carrier/verify_h2.py" "$GITHUB_WORKSPACE/.build/mc1-h2"

  external-antenna:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: MC2-D classic ESP32 and C6 RCP
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check MC2 guide and firmware contracts
        env:
          RF_CPP_SANITIZERS: "1"
        run: |
          python3 hardware/external-antenna/render.py --check
          python3 -m unittest discover -s firmware/external-antenna/tests -p 'test_*.py'
      - name: Install pinned build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r firmware/requirements.txt -r mechanical/requirements.txt
      - name: Verify MC2 native-linked printed enclosure
        run: |
          .venv/bin/python -m unittest discover -s mechanical/module-carrier/external-antenna-prototype -p 'test_*.py'
          .venv/bin/python mechanical/module-carrier/external-antenna-prototype/build.py --check
      - name: Verify full-hub component mounts and print geometry
        run: |
          .venv/bin/python -m unittest discover -s mechanical/full-hub -p 'test_*.py'
          .venv/bin/python mechanical/full-hub/build.py --check
      - name: Compile complete MC2-D classic ESP32 image
        run: .venv/bin/python firmware/external-antenna/validate.py .build/mc2 --esphome .venv/bin/esphome --compile
      - name: Compile and verify matching C6 RCP
        run: |
          IDF_PATH=$(.venv/bin/python -c 'import json; print(json.load(open(".build/mc2/firmware/external-antenna/.esphome/build/mc2-classic-hub/build/project_description.json"))["idf_path"])')
          export IDF_PATH
          export IDF_TOOLS_PATH="$RUNNER_TEMP/mc2-idf-c6"
          "$IDF_PATH/install.sh" esp32c6
          source "$IDF_PATH/export.sh"
          python "$GITHUB_WORKSPACE/firmware/external-antenna/prepare_c6.py" "$GITHUB_WORKSPACE/.build/mc2-c6" --idf "$IDF_PATH"
          idf.py -C "$GITHUB_WORKSPACE/.build/mc2-c6" -DIDF_TARGET=esp32c6 build
          python "$GITHUB_WORKSPACE/firmware/external-antenna/verify_c6.py" "$GITHUB_WORKSPACE/.build/mc2-c6" > "$GITHUB_WORKSPACE/.build/mc2-c6/build-result.json"
          cat "$GITHUB_WORKSPACE/.build/mc2-c6/build-result.json"
      - name: Bind complete compilation receipts to the checked-out source
        run: |
          test -s .build/mc2/firmware/external-antenna/build-result.json
          test -s .build/mc2-c6/build-result.json
          mkdir .build/mc2-evidence
          cp .build/mc2/firmware/external-antenna/build-result.json .build/mc2-evidence/build-evidence.json
          cp .build/mc2-c6/build-result.json .build/mc2-evidence/c6-build-evidence.json
          git rev-parse HEAD > .build/mc2-evidence/source-sha.txt
      - name: Preserve source-bound MC2 compilation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mc2-compilation-evidence
          path: .build/mc2-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  espnow:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: ESP-NOW complete hub and sensor examples
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Audit runner network access
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned firmware dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r firmware/requirements.txt
      - name: Check enrollment, freshness and full-hub configuration
        env:
          RF_CPP_SANITIZERS: "1"
        run: .venv/bin/python -m unittest discover -s tests -p 'test_espnow.py'
      - name: Compile full MC2-D ESP-NOW hub and three sensors
        run: .venv/bin/python firmware/espnow/validate.py .build/espnow --esphome .venv/bin/esphome --compile
      - name: Bind compilation receipt to the checked-out source
        run: |
          test -s .build/espnow/firmware/espnow/build-result.json
          mkdir .build/espnow-evidence
          cp .build/espnow/firmware/espnow/build-result.json .build/espnow-evidence/build-result.json
          for profile in climate probe contact; do
            cp ".build/espnow/firmware/espnow/$profile-build-result.json" .build/espnow-evidence/
          done
          git rev-parse HEAD > .build/espnow-evidence/source-sha.txt
      - name: Preserve ESP-NOW compilation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: espnow-compilation-evidence
          path: .build/espnow-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
