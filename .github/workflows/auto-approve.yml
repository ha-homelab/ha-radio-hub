name: Auto Approve PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Same-repository PR to approve
        required: true
        type: string
      expected-head:
        description: Exact 40-character commit SHA reviewed for recovery
        required: true
        type: string

# This workflow handles metadata only. Never check out or execute PR source here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.pull-request-number || github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      ((github.event.action != 'edited' || github.event.changes.base) &&
       (github.event_name == 'pull_request_target' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
       !github.event.pull_request.draft &&
       (contains(github.event.pull_request.labels.*.name, 'auto-approve') ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["californiantiramisu","renovate[bot]"]'), github.event.pull_request.user.login))))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@8249b82b506af2e62c03e33ce0990327dd5f55c6 # main
    with:
      pull-request-number: ${{ inputs.pull-request-number || '' }}
      expected-head: ${{ inputs.expected-head || '' }}
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
