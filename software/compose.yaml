name: ha-radio-hub
services:
  otbr:
    # OCI index verified on 2026-11-10; source f878579877aa25f76f2e09f8bc99f610920b357c.
    image: openthread/border-router@sha256:fd55a81192844ebac421bbc21c7563c0d2ce8bbe1277608ec606840d3a57ff76
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - "${THREAD_SERIAL_DEVICE:?Run render_config.py first}:/dev/thread-rcp"
      - /dev/net/tun:/dev/net/tun
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/thread-rcp?uart-baudrate=1000000"
      OT_INFRA_IF: "${INFRA_IF:?Set the LAN interface}"
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: "4"
      OT_REST_LISTEN_ADDR: "${HUB_LAN_IP:?Set the hub LAN IPv4 address}"
      OT_REST_LISTEN_PORT: "8081"
      OT_WEB_LISTEN_ADDR: "127.0.0.1"
      OT_WEB_LISTEN_PORT: "8080"
      OT_VENDOR_NAME: HA Radio Hub
      OT_VENDOR_MODEL: Pi4-PCA10059
    volumes:
      - otbr-data:/data
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  zigbee:
    build:
      context: ./ser2net
    image: ha-radio-hub/ser2net:4.3.11-1
    network_mode: host
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    devices:
      - "${ZIGBEE_SERIAL_DEVICE:?Run render_config.py first}:/dev/zigbee"
    volumes:
      - type: bind
        source: "${SER2NET_CONFIG:?Run render_config.py on the target Pi first}"
        target: /etc/ser2net.yaml
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  otbr-data:
