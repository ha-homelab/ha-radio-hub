# Copy into the prepared private build as secrets.yaml and replace EVERY value.
# Example station (STA) MACs are locally administered documentation placeholders.
# Read each board's ESP-NOW "Own address" serial log; the hub also exposes its STA MAC.
espnow_hub_mac: "02:00:00:00:00:10"
espnow_climate_mac: "02:00:00:00:00:11"
espnow_probe_mac: "02:00:00:00:00:12"
espnow_contact_mac: "02:00:00:00:00:13"

# Generate a different high-entropy value for every provider, e.g. secrets.token_hex(32).
# The hub and the matching provider must use the same value.
espnow_climate_key: "REPLACE-WITH-A-UNIQUE-RANDOM-CLIMATE-KEY"
espnow_probe_key: "REPLACE-WITH-A-UNIQUE-RANDOM-PROBE-KEY"
espnow_contact_key: "REPLACE-WITH-A-UNIQUE-RANDOM-CONTACT-KEY"

# These hub credentials are inherited by the full MC2-D profile.
api_encryption_key: "REPLACE-WITH-32-RANDOM-BYTES-ENCODED-AS-BASE64"
ota_password: "REPLACE-WITH-YOUR-HUB-OTA-PASSWORD"
mqtt_broker: "192.0.2.1"
mqtt_username: "REPLACE-WITH-YOUR-MQTT-USERNAME"
mqtt_password: "REPLACE-WITH-YOUR-MQTT-PASSWORD"
