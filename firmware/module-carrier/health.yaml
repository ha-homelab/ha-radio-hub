# Diagnostics remain available when the Thread stack is quarantined.
debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: Hub Reset Reason
  - platform: template
    name: Thread State
    entity_category: diagnostic
    update_interval: 5s
    lambda: return {id(thread_border_router).status()};
  - platform: template
    name: Thread Last Fault
    entity_category: diagnostic
    update_interval: 5s
    lambda: return {id(thread_border_router).fault()};

binary_sensor:
  - platform: template
    name: Thread Guard Durable
    entity_category: diagnostic
    lambda: return id(thread_border_router).guard_durable();
  - platform: template
    name: Thread Quarantined
    entity_category: diagnostic
    lambda: return id(thread_border_router).quarantined();

switch:
  - platform: template
    name: Pause Thread for H2 Service
    entity_category: config
    lambda: return false;
    turn_on_action:
      - lambda: id(thread_border_router).pause_for_service();
  - platform: template
    name: Retry Quarantined Thread
    entity_category: config
    lambda: return false;
    turn_on_action:
      - lambda: id(thread_border_router).retry();

api:
  actions:
    - action: pause_thread_for_h2_service
      then:
        - lambda: id(thread_border_router).pause_for_service();
    - action: retry_quarantined_thread
      then:
        - lambda: id(thread_border_router).retry();

sensor:
  - platform: debug
    free:
      name: Hub Internal Free Heap
    block:
      name: Hub Largest Heap Block
    min_free:
      name: Hub Minimum Free Heap
    psram:
      name: Hub Free PSRAM
    loop_time:
      name: Hub Longest Loop
  - platform: uptime
    name: Hub Uptime
  - platform: template
    name: Thread Fault Count
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(thread_border_router).fault_count();
  - platform: template
    name: Thread Retry Count
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(thread_border_router).retry_count();
  - platform: template
    name: Thread RCP Reset Count
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(thread_border_router).reset_count();
  - platform: template
    name: Thread Device Role
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(thread_border_router).role();
