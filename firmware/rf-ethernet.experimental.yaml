# EXPERIMENTAL replacement host for the CC1101: a SECOND Waveshare S3-ETH-M.
# Not a drop-in replacement for rf-airbridge MQTT/API contracts.
# No microSD or camera. CC1101 needs separate GDO0 (TX) and GDO2 (RX) wires.
esphome:
  name: ha-radio-hub-rf-test
  friendly_name: HA Radio Hub RF Test
  min_version: 2026.9.1
  compile_process_limit: 2

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 20MHz

logger:
  level: INFO
  baud_rate: 0

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  actions:
    - action: send_rc_switch
      variables:
        code: string
        protocol: int
        repeats: int
      then:
        - if:
            condition:
              lambda: |-
                for (const char bit : code) {
                  if (bit != '0' && bit != '1') return false;
                }
                return !code.empty() && code.size() <= 64 &&
                  protocol >= 1 && protocol <= 8 && repeats >= 1 && repeats <= 10;
            then:
              - remote_transmitter.transmit_rc_switch_raw:
                  code: !lambda return code;
                  protocol: !lambda return esphome::remote_base::RC_SWITCH_PROTOCOLS[protocol];
                  repeat:
                    times: !lambda return repeats;
                    wait_time: 10ms

spi:
  id: cc1101_spi
  interface: spi3
  clk_pin: GPIO7
  mosi_pin: GPIO8
  miso_pin: GPIO6

cc1101:
  id: rf_radio
  spi_id: cc1101_spi
  cs_pin: GPIO15
  frequency: 433.92MHz

globals:
  - id: rf_transmitting
    type: bool
    restore_value: false
    initial_value: 'false'

remote_transmitter:
  id: rf_tx
  pin: GPIO4
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - lambda: id(rf_transmitting) = true;
      - cc1101.begin_tx: rf_radio
  on_complete:
    then:
      - cc1101.begin_rx: rf_radio
      - lambda: id(rf_transmitting) = false;

remote_receiver:
  id: rf_rx
  pin: GPIO5
  tolerance: 30%
  filter: 250us
  idle: 4ms
  dump:
    - rc_switch
    - dooya
  on_rc_switch:
    then:
      - if:
          condition:
            lambda: return !id(rf_transmitting);
          then:
            - homeassistant.event:
                event: esphome.radio_hub_rf_received
                data:
                  protocol: !lambda return std::to_string(x.protocol);
                  code_decimal: !lambda return std::to_string(x.code);

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: API Connected
    entity_category: diagnostic
