# MC2-D: ESP32-DevKitC-VIE / WROVER-IE, 8 MB flash / 8 MB quad PSRAM.
# ECO V3+; at most 4 MB PSRAM is directly mapped. New carrier and factory flash required.
substitutions:
  build_jobs: "4"
  bme680_address: "0x77"
  rf_airbridge_path: ..
  rf_source: module_carrier
  rf_cs_pin: GPIO13
  rf_rx_pin: GPIO35
  rf_tx_pin: GPIO25
  rf_received_topic: build-only/rf/received
  rf_raw_topic: build-only/rf/raw
  rf_transmit_result_topic: build-only/rf/result

esphome:
  name: mc2-classic-hub
  min_version: 2026.10.0
  compile_process_limit: ${build_jobs}

esp32:
  board: esp32dev
  flash_size: 8MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf
    version: 5.5.5
    sdkconfig_options:
      CONFIG_ESP32_REV_MIN_3: y
      CONFIG_ESP_CONSOLE_NONE: y

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

ethernet:
  type: W5500
  spi_id: cc1101_spi
  cs_pin: GPIO5
  interrupt_pin: GPIO34
  reset_pin: GPIO4
  clock_speed: 10MHz

network:
  enable_ipv6: true
  min_ipv6_addr_count: 0

logger:
  level: INFO
  hardware_uart: UART0
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

external_components:
  - source:
      type: local
      path: ../low-power/components
    components: [low_power_otbr, low_power_ethernet, zigbee_tcp]
  - source:
      type: local
      path: ../module-carrier/components
    components: [wk2132_uart]

low_power_ethernet:

low_power_otbr:
  id: thread_border_router
  server_component_path: ../low-power/generated/esp_ot_br_server
  tx_pin: GPIO26
  rx_pin: GPIO36
  reset_pin: GPIO27
  boot_pin: GPIO15
  rest_port: 8081

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true
bluetooth_proxy:
  active: true
  connection_slots: 3

uart:
  - id: radar_uart
    tx_pin: GPIO23
    rx_pin: GPIO18
    baud_rate: 256000
    rx_buffer_size: 1024

ld2450:
  id: radar
  uart_id: radar_uart

i2c:
  id: expansion_bus
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

spi:
  id: cc1101_spi
  interface: spi2
  clk_pin: GPIO12
  mosi_pin: GPIO2
  miso_pin: GPIO19

packages:
  rf: !include ../packages/rf-airbridge.yaml
  environment: !include ../packages/bme680.yaml
  radar: !include ../packages/ld2450.yaml
  health: !include health.yaml

# Factory DFR0627 at 3.3 V, IA1=1 and IA0=0. Reserve 0x50–0x57; BME680 uses 0x77.
wk2132_uart:
  id: uart_zwave
  i2c_id: expansion_bus
  address: 0x50

zwave_proxy:
  id: zwave_radio
  uart_id: uart_zwave

# Ember EZSP/ASH four-wire 115200 8N1. MG24 owns Zigbee; the classic ESP32 transports bytes.
zigbee_tcp:
  tx_pin: GPIO32
  rx_pin: GPIO39
  rts_pin: GPIO33
  cts_pin: GPIO14
  port: 6638
