<text x="281.16" y="658.96" text-anchor="middle" class="n">RJ45</text>
<text x="55" y="720" class="h a">84.3 × 121.8 × 57.4 mm shell</text>
<text x="55" y="750" class="s">Installed depth 61.4 mm with 4 mm spacing frame.</text>
<text x="55" y="780" class="s">H2 antenna to upper end wall: 15.525 mm.</text>
<text x="520" y="173" class="h a">1. Ceiling-side base</text>
<text x="520" y="202" class="s">WIZ850io, male headers, diodes and resistors face the ceiling.</text>
<text x="520" y="268" class="h a">2. Lower onto open seats</text>
<text x="520" y="297" class="s">Fit back parts first, then front modules, then place the PCB.</text>
<text x="520" y="363" class="h a">3. One H3 + retaining cover</text>
<text x="520" y="392" class="s">Case screws hit hard stops. They must not compress the PCB.</text>
<text x="520" y="458" class="h a">4. Jack insertion load</text>
<text x="520" y="487" class="s">Trial stop must touch measured metal cage, never preload pins.</text>
<text x="520" y="553" class="h a">5. External devices stay external</text>
<text x="520" y="582" class="s">PoE splitter, buck, extra radios and sensors are not packed here.</text>
<text x="520" y="683" class="h">Section through edge support (trial Z)</text>
