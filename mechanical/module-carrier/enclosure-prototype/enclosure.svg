<text x="990" y="739" class="n w">25 mm front cavity</text>
<text x="990" y="830" class="n w">26 mm rear cavity</text>
<text x="990" y="865" class="n">Both are assumptions.</text>
<text x="36" y="967" class="s w">Print coupons first. Measure modules, wiring, rail play and actual jack contact before loading or ceiling installation.</text>
