<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="920" viewBox="0 0 1320 920" role="img" aria-label="One PCB retainer. Distributed support along selected edges.">
<style>text{font-family:Arial,sans-serif;fill:#dce8f2}.title{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#b5c9d9}.label{font-size:16px}.small{font-size:13px}.strong{font-weight:bold}.green{fill:#91e1bb}.warn{fill:#f6c765}</style>
<rect width="1320" height="920" fill="#0e1b29"/>
<text x="36" y="46" class="title">One PCB retainer. Distributed support along selected edges.</text>
<text x="36" y="80" class="sub">Native front view: contact bands on both faces; case walls and full enclosure height are not defined.</text>
<polygon points="83.000,165.000 415.500,165.000 415.500,690.000 83.000,690.000" fill="#193e3b" stroke="#80d3be" stroke-width="2"/>
<polygon points="275.920,468.170 275.920,158.910 407.380,158.910 407.380,468.170" fill="#355260" fill-opacity="0.7" stroke="#91abbc" stroke-dasharray="4 4"/>
<text x="341.65" y="313.54" class="label" text-anchor="middle">U1 front</text>
<polygon points="88.600,123.175 273.400,123.175 273.400,505.795 88.600,505.795" fill="#355260" fill-opacity="0.7" stroke="#91abbc" stroke-dasharray="4 4"/>
<text x="181" y="314.485" class="label" text-anchor="middle">U2 front</text>
<polygon points="81.110,549.153 212.570,549.153 212.570,702.838 81.110,702.838" fill="#355260" fill-opacity="0.7" stroke="#91abbc" stroke-dasharray="4 4"/>
<text x="146.84" y="625.995" class="label" text-anchor="middle">U3 front</text>
<polygon points="233.500,510.100 394.500,510.100 394.500,685.100 233.500,685.100" fill="#1b4774" fill-opacity="0.7" stroke="#73b5ff" stroke-dasharray="6 3"/>
<text x="314" y="606" class="label" text-anchor="middle">WIZ rear</text>
<rect x="83" y="270" width="5.95" height="276.5" fill="#f6c765" stroke="#fff0ba"/>
<rect x="407.1" y="221" width="8.4" height="462" fill="#f6c765" stroke="#fff0ba"/>
<circle cx="209.0" cy="529.21" r="17.5" fill="#172f42" stroke="#91e1bb" stroke-width="2"/>
<circle cx="209.0" cy="529.21" r="9.45" fill="#0e1b29" stroke="#91e1bb"/>
<text x="209" y="504.21" class="label green" text-anchor="middle">H3 only</text>
<text x="83" y="738" class="label strong" text-anchor="start">47.5 × 75 mm PCB; two copper layers</text>
<text x="535" y="156" class="label strong" text-anchor="start">Defined contact regions</text>
<text x="535" y="198" class="label green" text-anchor="start">Left: x 0…0.85; y 15…54.5 mm</text>
<text x="535" y="227" class="sub" text-anchor="start">0.85 mm bearing width × 39.5 mm length</text>
<text x="535" y="293" class="label green" text-anchor="start">Right: x 46.3…47.5; y 8…74 mm</text>
<text x="535" y="322" class="sub" text-anchor="start">1.2 mm bearing width × 66 mm length</text>
<text x="535" y="420" class="sub" text-anchor="start">Yellow bands are MAXIMUM reach from the actual board edge.</text>
<text x="535" y="450" class="sub" text-anchor="start">Nominal lips are inset for the trial ±0.2 mm XY motion budget.</text>
<text x="535" y="480" class="sub" text-anchor="start">Budget includes rotation / print error; measure to establish it.</text>
<text x="535" y="535" class="sub" text-anchor="start">Lower into an open frame; never push populated PCB through rails.</text>
<text x="535" y="565" class="sub" text-anchor="start">H3 retains the PCB; case fasteners and locating stops are separate.</text>
<text x="535" y="595" class="sub" text-anchor="start">The rail outside wall still needs a physical / RF clearance review.</text>
<text x="535" y="650" class="sub" text-anchor="start">WIZ needs a measured jack stop / cradle and cable strain relief.</text>
<text x="535" y="680" class="sub" text-anchor="start">Edge grooves alone do not bypass the WIZ header solder joints.</text>
<text x="36" y="804" class="small" text-anchor="start">Source PCB SHA-256 c02f47112b37f0869d86eb15…</text>
<text x="36" y="844" class="label warn" text-anchor="start">Geometry proposal, not a verified enclosure. Measure solder growth, board thickness and module heights before release.</text>
</svg>
