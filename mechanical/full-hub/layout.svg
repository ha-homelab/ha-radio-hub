<text x="155" y="108" class="n" text-anchor="middle">BLE</text>
<text x="350" y="108" class="n" text-anchor="middle">THREAD</text>
<text x="545" y="108" class="n" text-anchor="middle">ZIGBEE</text>
<text x="900" y="140" class="s">1. MC2-D carrier + U1–U4</text>
<text x="900" y="165" class="n">Envelope 100 × 102 × 30 mm</text>
<text x="900" y="202" class="s">2. Isolated PoE splitter</text>
<text x="900" y="227" class="n">Envelope 102.5 × 29.6 × 24.8 mm</text>
<text x="900" y="264" class="s">3. RECOM 3.3 V + 27 µF</text>
<text x="900" y="289" class="n">Envelope 24 × 24 × 18 mm</text>
<text x="900" y="326" class="s">4. DFR0627 / WK2132</text>
<text x="900" y="351" class="n">Envelope 32.5 × 27 × 16 mm</text>
<text x="900" y="388" class="s">5. Zooz ZAC93 Z-Wave</text>
<text x="900" y="413" class="n">Envelope 28.5 × 28.5 × 18 mm</text>
<text x="900" y="450" class="s">6. CC1101 RF transceiver</text>
<text x="900" y="475" class="n">Envelope 55 × 30 × 18 mm</text>
<text x="900" y="512" class="s">7. LD2450 radar → room</text>
<text x="900" y="537" class="n">Envelope 44 × 15 × 10 mm</text>
<text x="900" y="574" class="s">8. BME680 ambient sensor</text>
<text x="900" y="599" class="n">Envelope 25.4 × 17.78 × 10 mm</text>
<text x="900" y="636" class="s">9. Insulated 5 V DC adapter</text>
<text x="900" y="661" class="n">Envelope 40 × 16 × 18 mm</text>
<text x="900" y="698" class="s">10. Insulated inline DC fuse</text>
<text x="900" y="723" class="n">Envelope 35 × 18 × 18 mm</text>
<text x="40" y="840" class="s">215 × 215 × 78 mm main case; attached ambient pod extends overall width to 277 mm.</text>
<text x="40" y="873" class="s">ZAC93: 2×5 socket faces downward into the open cradle; stock antenna faces the plastic right wall.</text>
<text x="40" y="906" class="s">LD2450 attaches to the lid, faces +Z through a 0.8 mm window; disconnect its harness before lifting lid away.</text>
<text x="40" y="952" class="s" style="fill:#ffd294">Engineering prototype: digital clearances passed; print fit, exact board revision, cable bends, RF and temperature bias unmeasured.</text>
</svg>
